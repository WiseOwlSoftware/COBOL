name: Build and Test

# ⛔ EVERY PUSH RUNS THIS WORKFLOW — there is no `paths-ignore` any more, and there must never be one again.
# `main` carries a REQUIRED status check (`ci-gate`; owner decision 2026-09-06 on question 23, kb/Work/PB796),
# and a required check is satisfied per COMMIT — so a workflow that declines to START leaves the pushed sha with
# no check at all and the protection blocks it FOREVER. `paths-ignore` and branch protection are therefore
# mutually exclusive; measured 2026-09-06, the three docs-only pushes after train 21 produced NO run at all.
# The saving the ignore list bought is kept, one layer down: the `changes` job below decides whether the MATRIX runs,
# from THE INERT LANE (scripts/inert_lane.py, kb/Work PB2878): a change confined to paths no test reads still starts a
# run, but its merge-group run is `changes` + `audits` + `ci-gate` and finishes in about five minutes. (`audits` is never
# skipped in the merge group: an inert change is exactly where a wrong citation or a malformed register note arrives.
# A pull request's and a push's run is `changes` + `ci-gate`, and a push adds the cache jobs, kb/Work PB4330.)
on:
  push:
    # `main` — the branch the protection guards, and the branch every instrument already reads
    # (`scripts/session-probe.ps1`, `.claude/skills/gate/SKILL.md`, plan §9 all key on `--branch main`).
    # ⚠ Deliberately NOT `branches: '**'`: up to six implementer worktrees push WIP branches all day
    # (`worktree-agent-*`, `impl/*`), and a two-platform matrix per WIP push is precisely the cost this
    # repository has already refused once (the 2026-08-08 owner flag). Nothing else is pushed to land: main takes
    # only queued pull requests (the ruleset binds administrators, kb/Work PB3024), so the one push this trigger sees
    # is the merge-queue commit main advances to, which its `merge_group` run below already tested.
    branches: [ main ]
  # ── THE MERGE QUEUE (kb/Work PB3024; DESIGN-test-build-ci.md §3.17.2 steps 4–5, §3.17.6). A pull request runs the
  # REQUIRED CHECK only (`changes`, `ci-gate`; the audits run once, in the merge group, kb/Work PB4330), so twenty queued PRs never put twenty full matrices behind the
  # organization's 60-concurrent-job limit (GitHub Team, 2026-10-25; the Free plan's was 20); the MERGE GROUP (several queued PRs on top of main) runs the matrix and is the
  # one whole-population run each change gets. `ci-gate` is the required check on both; on the group it is the full
  # verdict. The merge-queue commit IS the commit main advances to, so its `push` run takes the already-verified
  # short-circuit in `changes`. ⛔ A pull request's green `ci-gate` is therefore NOT a verdict on the matrix: nothing
  # may merge a PR except the queue, which is why `scripts/orchestrator/enqueue.py` refuses to open or queue one unless
  # `ruleset.py check` reports the queue ACTIVE on main (LandingPipelineDriftTests). ──
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:        # manual trigger — a full-matrix run on demand

# ⛔ A PUSH IS NEVER CANCELLED — ITS RUN IS THAT COMMIT'S ONLY VERDICT. With a required per-commit check a
# cancelled run leaves its sha permanently unlandable (`cancelled` is not `success`), and it is the failure mode
# a human skim reads as "not a failure": PB796 counted SIX cancelled rows inside the 29-hour red window. A
# `pull_request` run, by contrast, is superseded the moment its head moves, so cancelling it costs no coverage
# and saves the minutes this group was added for. A merge group's ref is unique to the group
# (`gh-readonly-queue/main/pr-<n>-<sha>`), so two groups never collide anyway; this expression makes that safety
# explicit instead of incidental. For the same reason no concurrency group can cancel a merge-group run the queue has
# replaced: the `supersede` job does (kb/Work PB3769).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The tests run as WEIGHTED SHARDS (kb/Work PB4329; the `linux-shard` and `windows-shard` jobs below): every shard job
# runs every test assembly, and the test framework deals it the test classes of its shard by their measured weight,
# so the merge group's wall clock is the slowest shard's and every shard is about equal. The NIST corpus through the
# CLI (scripts/guard-fast.sh) runs in the nightly workflow (owner 2026-10-31, kb/Work PB4323 decision 2; PB4332). All
# jobs are independent gates — a failure in one is never masked by another.
#
# ⛔ EVERY LINUX `dotnet test` STEP RUNS UNDER THE INERT WATCH (`python3 scripts/inert_lane.py watch -- dotnet test …`;
# kb/Work PB2878, InertLaneDriftTests): a test that opens a path the inert lane classes as read by no test turns its step
# RED naming the path, so the classification that lets an inert change skip this matrix stays true. The Windows steps
# run the same tests and need no watch of their own (Windows has no open events).
#
# EVERY direct `dotnet test` step also writes a TRX log (--logger trx, --results-directory TestResults/<OS>-<job>/)
# and its job uploads them with `if: always()` as artifact test-results-<OS>-<job> (14-day retention) — a
# red is diagnosable from the artifact without a re-run (kb/Work PB108). The two OSes share shard NUMBERS, so the
# artifact name carries both: a shard's is test-results-<OS>-shard-<k>, the exact pattern `ci-gate`'s name check
# downloads and scripts/shard_weights.py reads. Each such step also sets WISEOWL_COBOL_HARNESS_LOG to
# <its results directory>/harness-observations.log and its job uploads that file with the TRX: the test harness's every
# retry and non-observation of a child process, with the budget, the work it covered and the host's load, so a
# non-observation on CI is read from the artifact (kb/Work PB3108; CiHarnessLogDriftTests).
#
# ⛔ AN ARTIFACT NEVER DECIDES A VERDICT (kb/Work PB3140; CiArtifactDriftTests): every upload goes through ONE step,
# ./.github/actions/upload-results (tried three times; when all fail it warns and passes), and every download through
# ./.github/actions/download-results (tried three times; the third failure fails the job that needs it). A bare
# actions/upload-artifact step under `always()` once failed a shard whose 5338 tests had all passed, on an artifact
# service ETIMEDOUT, and the merge queue removed the pull request (merge-group run 38502926616, PR #39).
#
# ⛔ NO JOB SETS A VARIABLE THAT NARROWS A TEST RUN (kb/Work PB1718; DESIGN-test-build-ci §3.14.3): the gate's leg
# handshake WISEOWL_COBOL_GATE_*, or VSTest* / RunSettingsFilePath, which MSBuild imports from the environment as the
# VSTest target's filter and run settings. A hosted job's environment is exactly what this file declares, so that
# is how CI scrubs; `python scripts/test_population.py audit-callers` (GateLegDriftTests arm 6) is red on one. The one
# exception is the shard variable WISEOWL_COBOL_SHARD (kb/Work PB4329), a DIVISION of the run whose union `ci-gate`
# checks against the discovered population, and the audit allows it only in a workflow that runs that check.
jobs:
  # ── ⛔ WHETHER THE MATRIX RUNS: THE INERT LANE (kb/Work PB2878; DESIGN-test-build-ci.md §3.18). A path list here used
  # to decide it (`paths-ignore` on the trigger first, which left a sha with no check at all under the required status
  # check, then a doc-only regex in this job); but that list was not a classification: `docs/` and `kb/Work/` are TEST
  # INPUTS, so a change to them skipped the very tests that read them (kb/Work PB3603). The classification now has ONE
  # home, scripts/inert_lane.py, which this job, the local gate and the Linux gate all call, and which the
  # inotify watch on every Linux test step below proves: a test that opens an inert path turns its step RED. ──
  changes:
    name: changes (does this commit need the matrix?)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read            # for the already-verified short-circuit below — read-only, nothing else
    outputs:
      run_matrix: ${{ steps.decide.outputs.run_matrix }}
      code: ${{ steps.decide.outputs.code }}
      verified: ${{ steps.decide.outputs.verified }}
      reason: ${{ steps.decide.outputs.reason }}
      # Whether the change TOUCHES TOOLING (scripts/inert_lane.py `classify`, kb/Work PB4326): a path a script self-test
      # reads (the scripts, and the data TOOLING_READS names, held complete by self_tests.py's proof), so `windows-self-tests`
      # runs only then. `true` whenever nothing proves otherwise.
      tooling: ${{ steps.decide.outputs.tooling }}
      # What this merge group proposes to add is `base..sha` — the `audits` job's witness-loss check compares against it.
      # Empty when no honest base exists (a dispatch run, an unresolvable `before`); that check then falls back
      # to its own default, the merge-base with origin/main.
      base: ${{ steps.decide.outputs.base }}
    steps:
      - id: checkout
        uses: actions/checkout@v7
        timeout-minutes: 5
        continue-on-error: true  # one retry follows (kb/Work PB4324)
        with:
          submodules: false
          # Full history so `git diff <before> <sha>` can resolve BOTH ends (a train pushes several commits at
          # once, so depth 2 is not enough); `filter: blob:none` keeps the fetch to commits and TREES, which is
          # all `--name-only` reads — seconds, not a full clone with every historical blob.
          fetch-depth: 0
          filter: blob:none
      - if: steps.checkout.outcome != 'success'
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          submodules: false
          fetch-depth: 0
          filter: blob:none
      - name: Setup the toolchain (toolchain.env's exact versions, cached; kb/Work PB4007)
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 5
      - name: Decide — the inert lane, or does the matrix have to run?
        id: decide
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          # What a merge group adds to main is measured from ITS base, not from `before`.
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ZERO=0000000000000000000000000000000000000000
          code=true; verified=false; reason=""; BASE=""; tooling=true
          if [ "$EVENT" = "pull_request" ]; then
            # ⛔ THE REQUIRED CHECK ONLY (kb/Work PB3024, PB4330): the matrix AND the audits run on the MERGE GROUP, which
            # tests this PR on top of main together with the others queued and is the one run each change gets. A PR run
            # is `changes` and `ci-gate`, nothing else: the audits (citations, self-tests, the work register, the fleet
            # practices) ran in the implementer's gate and run once more in the merge group, not a third time here.
            code=false
            reason="event=pull_request — the matrix and the audits run on the merge group (kb/Work PB3024, PB4330); this run is changes and ci-gate only"
          elif [ "$EVENT" != "push" ] && [ "$EVENT" != "merge_group" ]; then
            reason="event=$EVENT — a dispatch run is always the full matrix"
          else
            if [ "$EVENT" = "merge_group" ]; then
              # The group's base is the head of the group queued AHEAD of it (main itself only for the first), so
              # base..sha is this pull request's own change: the groups ahead were tested by their own runs, and the
              # queue merges a group only after every group ahead of it passed (kb/Work PB3107/PB3123 measured it: run
              # 38360587401's base held entry 1996 before that pull request reached main). A docs-only pull request
              # skips the matrix exactly as a docs-only landing did before the queue. With no resolvable base the
              # matrix runs (below).
              if [ -n "${GROUP_BASE:-}" ] && git cat-file -e "${GROUP_BASE}^{commit}" 2>/dev/null; then
                BASE="$GROUP_BASE"
              fi
            elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$ZERO" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$BEFORE" "$SHA"; then
              BASE="$BEFORE"          # the ordinary case: before..sha IS what this push to main added
            fi
            # (A push is only ever to main — `push.branches` above — so there is no new-branch arm: a `before` the
            # runner cannot resolve leaves BASE empty and the matrix runs, unless the short-circuit below finds the
            # merge group's green run on this very sha.)
            if [ -z "$BASE" ]; then
              reason="no usable base (before=${BEFORE:-<unset>}, ref=$REF) — the matrix runs"
            else
              echo "--- changed paths ($BASE..$SHA) ---"; git diff --name-only --no-renames "$BASE" "$SHA"
              # THE ONE CLASSIFICATION (scripts/inert_lane.py; kb/Work PB2878). An empty diff is the full lane: it is
              # evidence of a no-op or a probe, never that no test reads the change (feedback_verdict_evidence_invariant).
              lane_out="$(python3 scripts/inert_lane.py classify --base "$BASE" --head "$SHA")"
              lane_reason="$(printf '%s\n' "$lane_out" | sed -n 's/^reason=//p')"
              # A change proved to touch no tooling (kb/Work PB4326): any other answer, or none, leaves it true.
              if printf '%s\n' "$lane_out" | grep -qx 'tooling=false'; then tooling=false; fi
              if printf '%s\n' "$lane_out" | grep -qx 'lane=inert'; then
                code=false
                reason="inert lane over $BASE..$SHA: $lane_reason — the matrix is skipped"
              else
                reason="full lane over $BASE..$SHA: ${lane_reason:-$lane_out}"
              fi
            fi
          fi
          # ── THE ALREADY-VERIFIED SHORT-CIRCUIT. The merge queue tests the merge-group commit (`merge_group` run on
          # `gh-readonly-queue/main/...`) and then advances main to THAT SAME SHA; without this, that identical tree
          # would pay for the matrix TWICE per landing — the exact waste the owner flagged on 2026-08-08 over a single
          # spent run. A workflow run is keyed by its head sha, so a green run on this sha is a verdict on this exact
          # tree whatever ref earned it. Any failure of the lookup leaves verified=false and the matrix runs.
          # Measured on the first three queued landings (kb/Work PB3024 item 3): PR 7 → 79d760ab6, PR 8 → 424e699ec,
          # PR 9 → 9d18aa9ab each found its one `merge_group` run green and skipped the matrix on main's `push` run.
          # ⛔ ONLY A RUN THAT COULD HAVE RUN THE MATRIX COUNTS (kb/Work PB3024): a `pull_request` run is the cheap jobs
          # only, and its green `ci-gate` is attached to the PR's head commit — a commit main itself may later point at — so a
          # check-run lookup would read it as a verdict on the matrix. A successful run of THIS workflow (whose
          # `ci-gate` is `if: always()`, so a success run is a green ci-gate) from any event but `pull_request` is.
          if [ "$code" = "true" ] && [ "$EVENT" = "push" ]; then
            n="$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                   --jq '[.workflow_runs[] | select((.path | startswith(".github/workflows/build-and-test.yml"))
                          and .event != "pull_request" and .conclusion == "success")] | length' 2>/dev/null || echo 0)"
            case "$n" in ''|*[!0-9]*) n=0 ;; esac
            if [ "$n" -gt 0 ]; then
              verified=true
              reason="$reason; BUT a non-PR run already succeeded on $SHA ($n green run(s)) — same commit, same tree"
            fi
          fi
          run_matrix=true
          if [ "$code" != "true" ] || [ "$verified" = "true" ]; then run_matrix=false; fi
          reason="$(printf '%s' "$reason" | tr '\n' ' ')"
          {
            echo "run_matrix=$run_matrix"
            echo "code=$code"
            echo "verified=$verified"
            echo "reason=$reason"
            echo "tooling=$tooling"
            echo "base=$BASE"
          } >> "$GITHUB_OUTPUT"
          echo "run_matrix=$run_matrix (code=$code verified=$verified tooling=$tooling): $reason"
          {
            echo "### changes"
            echo
            echo "\`run_matrix\` = **$run_matrix**  (code=$code, verified=$verified, tooling=$tooling)"
            echo
            echo "$reason"
          } >> "$GITHUB_STEP_SUMMARY"
      # ── ⛔ THE DRIFT TEST FOR THE GATE ITSELF. `ci-gate` can only block a red it is `needs:`-wired to see, and
      # a job added months from now without that wiring would be a job whose failure lands on main silently —
      # the same shape as PB796 one level down. This asserts, from the workflow file itself, that every job id
      # is in ci-gate's needs list. It runs on EVERY event, docs-only pushes included, because `changes` is the
      # one job that is never skipped. Its own failure branch is exercised, not assumed (see kb/Work/PB796). ──
      - name: Drift — every job in this workflow is a `needs:` of ci-gate
        shell: bash
        run: |
          set -uo pipefail
          wf=.github/workflows/build-and-test.yml
          ids=$(sed -n '/^jobs:$/,$p' "$wf" | sed -nE 's/^  ([A-Za-z0-9_-]+):[[:space:]]*$/\1/p')
          n=$(printf '%s\n' "$ids" | grep -c . || true)
          # ⛔ A selector is evidence about what it RETURNED, never about what it dropped: a parser that finds
          # no jobs must fail loudly, not report "no drift" (feedback_measure_the_selectors_complement).
          if [ "$n" -lt 5 ]; then
            echo "::error::the job-id scan found $n jobs in $wf — the SCANNER is broken, not the workflow"
            exit 1
          fi
          needs_line=$(awk '/^  ci-gate:$/{f=1} f && /^    needs: \[/{print; exit}' "$wf")
          if [ -z "$needs_line" ]; then
            echo "::error::ci-gate has no single-line \`needs: [...]\` — this drift check parses that form"
            exit 1
          fi
          flat=",$(printf '%s' "$needs_line" | sed -E 's/^    needs: \[(.*)\].*/\1/' | tr -d '[:space:]'),"
          missing=""
          for id in $ids; do
            [ "$id" = "ci-gate" ] && continue
            case "$flat" in *",$id,"*) ;; *) missing="$missing $id" ;; esac
          done
          if [ -n "$missing" ]; then
            echo "::error::ci-gate does not need:$missing — a job the gate cannot see is a red that cannot block a landing"
            exit 1
          fi
          echo "drift: ci-gate needs all $((n - 1)) other jobs — $flat"

  # ── SUPERSEDED MERGE-GROUP RUNS ARE CANCELLED, SO THEY RELEASE THEIR RUNNERS (kb/Work PB3769;
  # DESIGN-test-build-ci.md §3.17.2 step 4). When an entry ahead fails or leaves, GitHub rebuilds every group behind it with new commits and new
  # runs, and the old runs kept their runners until they finished (2026-10-25: five such runs after #591's ejection,
  # cancelled by hand). `concurrency` cannot catch them: each group's ref is unique. So every merge-group run starts
  # with this job (no `needs`): it cancels each unfinished merge-group run whose head commit no current queue entry
  # heads, never its own and never a live entry's, and cancels NOTHING when the queue cannot be read whole
  # (scripts/orchestrator/cancel_superseded.py, whose self-test holds every arm). It is the ONE job with `actions:
  # write`, and EVERY step of it is `continue-on-error` (the script runs only when the checkout succeeded, and a failed
  # checkout is said as a warning): housekeeping never decides a verdict (LandingPipelineDriftTests, kb/Work PB3820). ──
  supersede:
    name: supersede (cancel the merge-group runs the queue replaced)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: write          # cancel a superseded workflow run: this job only
      contents: read          # the sparse checkout of the script
      pull-requests: read     # the merge queue's entries (GraphQL mergeQueue), each a pull request
    steps:
      - id: checkout
        uses: actions/checkout@v7
        timeout-minutes: 5
        continue-on-error: true  # one retry follows (kb/Work PB4324)
        with:
          submodules: false
          # scripts/standard_streams.py: every orchestrator script imports its one UTF-8 switch (kb/Work PB3637)
          # SparseCheckoutDriftTests (kb/Work PB3787) holds this list: every file the job runs, and every module those
          # import anywhere in their text (a function body's lazy import too, kb/Work PB3810), must be listed, or the
          # continue-on-error script step cancels nothing while the run stays green
          sparse-checkout: |
            scripts/orchestrator
            scripts/standard_streams.py
            scripts/live_tools.py
            scripts/scratch_repo.py
            .github/actions/setup-toolchain
            toolchain.env
            scripts/install-tool.sh
            scripts/toolchain.py
          sparse-checkout-cone-mode: false
      - id: checkout-retry
        if: steps.checkout.outcome != 'success'
        uses: actions/checkout@v7
        timeout-minutes: 5
        continue-on-error: true
        with:
          submodules: false
          sparse-checkout: |
            scripts/orchestrator
            scripts/standard_streams.py
            scripts/live_tools.py
            scripts/scratch_repo.py
            .github/actions/setup-toolchain
            toolchain.env
            scripts/install-tool.sh
            scripts/toolchain.py
          sparse-checkout-cone-mode: false
      - name: Setup the toolchain (toolchain.env's exact versions, cached; kb/Work PB4007)
        if: steps.checkout.outcome == 'success' || steps.checkout-retry.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 5
      - name: Cancel the superseded merge-group runs (cancel_superseded.py)
        if: steps.checkout.outcome == 'success' || steps.checkout-retry.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: python3 scripts/orchestrator/cancel_superseded.py --repo "$REPO" --run-id "$RUN_ID" --sha "$SHA"
      - name: Say that the checkout failed, so nothing was cancelled
        if: steps.checkout.outcome != 'success' && steps.checkout-retry.outcome != 'success'
        continue-on-error: true
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout-retry.outcome }}
        run: echo "::warning::supersede - the checkout ended $CHECKOUT_OUTCOME, so no superseded merge-group run was cancelled; housekeeping never decides a verdict (kb/Work PB3820)"

  # ── ⛔ THE STATIC AUDITS — ON EVERY MERGE GROUP, DOCS-ONLY LANDINGS INCLUDED, AND NOWHERE ELSE (kb/Work PB1574,
  # PB4330). A wrong clause number is
  # the one defect class no test can fail on (`// MOVE (§14.9.24)` compiles; §14.9.24 is MERGE), so CLAUDE.md
  # rule 1 is enforced by these scripts and nothing else — and until PB1574 they ran only in the local gate
  # and battery phase -1. Every commit that never ran the local gate (a cloud registrar's, a golden lane's, any
  # docs-only landing) therefore reached main unaudited: FOURTEEN wrong or unqualified clause numbers did, and every
  # later wave-local verdict went RED on findings nobody in that wave had written. They run HERE, where `ci-gate`
  # can refuse them, and NOT behind `run_matrix`: `kb/` and `DEVLOG/` are the inert lane's paths, which skip the
  # matrix, and they carry citations. They ran three times per landing (the pull request, the merge group and the
  # push of the merge-queue commit, 5.7 minutes each); they run ONCE, in the merge group, which is the first run of the
  # merged tree and the only one a landing waits for (kb/Work PB4330): the pull request's run is `changes` and `ci-gate`
  # (the required check), and main's push run adds only the cache jobs. A dispatch run, and a push no merge group
  # verified (its matrix runs), are full runs and audit too.
  # They need no build and no submodule — `specs/ISO_COBOL.md` is tracked in this repository (the private
  # submodule holds only the PDF) — and only the standard library of toolchain.env's Python, which also runs their
  # `--self-test`s inside the Unit leg (`CitationAuditSelfTestDriftTests`), proving each check can still fail.
  # ONE STEP PER AUDIT, each `if: !cancelled()`, so one red never hides the others' verdicts.
  # ⛔ This is the SAME list, in the same order, as the gate driver's (`scripts/gate.py` AUDITS) and battery
  # phase -1; the
  # work-register and fleet-practices checks are added because a `kb/` or brief edit is a docs-only push, and
  # nothing else validates it there. ──
  audits:
    name: audits (citations · evidence supersession · witness loss · work register)
    needs: changes
    if: github.event_name == 'merge_group' || needs.changes.outputs.run_matrix == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - id: checkout
        uses: actions/checkout@v7
        timeout-minutes: 5
        continue-on-error: true  # one retry follows (kb/Work PB4324)
        with:
          submodules: false
          # The witness-loss audit reads the inventory AT THE BASE (`git show <base>:…`): full history, blobs
          # fetched on demand — the same partial clone `changes` uses.
          fetch-depth: 0
          filter: blob:none
      - if: steps.checkout.outcome != 'success'
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          submodules: false
          fetch-depth: 0
          filter: blob:none
      - name: Setup the toolchain (toolchain.env's exact versions, cached; kb/Work PB4007)
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 5
      # tooling_check.py's self-test proves every agent role and skill definition LOADS by parsing its frontmatter with
      # PyYAML (kb/Work PB3097: an unparseable role printed OK and was never loaded). The local hosts carry PyYAML 6.0.3
      # (Windows pip; under WSL the uv-managed CPython that linux-gate.sh runs, installed by scripts/wsl/setup-wsl.sh,
      # and linux-gate.sh is NOT RUN without it); actions/setup-python's interpreter carries no packages, so it is
      # pinned here.
      - name: Python YAML parser for the tooling self-test (pyyaml, pinned)
        run: python3 -m pip install --disable-pip-version-check --no-input pyyaml==6.0.3
      - name: Code citations — the clause vs the construct it names (audit_code_citations.py --check)
        run: python3 scripts/spec/audit_code_citations.py --check
      - name: Doc citations — a quoted fragment vs the clause it is filed under (audit_doc_citations.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/spec/audit_doc_citations.py --check
      - name: Evidence supersession — a frozen record's claim the tree now contradicts (audit_evidence_supersession.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/spec/audit_evidence_supersession.py --check
      - name: Rendered views — none tracked, every in-tree one gitignored, every generator renders (rendered_views.py --check, kb/Work PB3026)
        if: ${{ !cancelled() }}
        run: python3 scripts/rendered_views.py --check
      - name: Witness loss — inventory evidence dropped since the base of this push (audit_witness_loss.py --check)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          set -euo pipefail
          # `base..sha` is what this push adds (the `changes` job's own decision); with no honest base the audit
          # uses its default, the merge-base with origin/main — present, because the checkout is full-history.
          if [ -n "${BASE:-}" ]; then
            python3 scripts/spec/audit_witness_loss.py --check --base "$BASE"
          else
            python3 scripts/spec/audit_witness_loss.py --check
          fi
      - name: DEVLOG — the landing carries exactly one new, stamped entry file (devlog.py check)
        # Every landing on main carries its one DEVLOG entry (CLAUDE.md rule 6; kb/Work PB2605, PB3025). Checked on what
        # a landing PROPOSES — its merge group — against the group's base; a push to main (the merge-queue commit) was
        # checked as its merge group, a pull request runs no audit (kb/Work PB4330) and a dispatch run proposes nothing.
        if: ${{ !cancelled() && github.event_name == 'merge_group' }}
        shell: bash
        env:
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          python3 scripts/devlog.py check --base "$MG_BASE" --rev HEAD
      - name: Rule catalog — the unharvested-rule manifest agrees with the transcription (extract_rule_catalog.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/spec/extract_rule_catalog.py --check
      - name: Spec corrections — every flag, Addendum entry, printed form and page agree (verify_publishable.py)
        if: ${{ !cancelled() }}
        run: python3 scripts/spec/verify_publishable.py
      # One line ending, LF (kb/Work PB3029): no tracked text file's blob or checkout holds a CR, and every Python writer
      # states newline=. Here it guards the INDEX (a commit made outside git's attributes); windows-self-tests runs it
      # again over a Windows checkout, the bytes `core.autocrlf` used to turn CRLF.
      - name: Line endings — LF in every tracked text file, index and checkout (line_endings.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/line_endings.py --check
      # No tracked file carries an unresolved merge conflict (kb/Work PB735). An AUDIT since the inert lane (kb/Work
      # PB2878): as a Unit test that read every tracked file it made every path one a test reads, and it never ran in CI
      # on a change whose matrix was skipped.
      - name: Conflict markers — no tracked file carries an unresolved merge conflict (conflict_markers.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/conflict_markers.py --check
      # Every diagnostic code is COBOL####, every number kept (kb/Work PB3575): the rename's own rules asked as a
      # question, so a branch that merged main without converting itself is red here. An audit, not a Unit test, for the
      # reason the conflict-marker check is one (kb/Work PB2878).
      - name: Diagnostic prefix — no tracked file spells a code with the former prefix (rename_diagnostic_prefix.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/rename_diagnostic_prefix.py --check
      # The code carries the product's name, WiseOwl.Cobol (kb/Work PB3837): no tracked path or line outside history spells
      # a retired name. The rename's audit, for the same reason as the two above.
      - name: Retired names — no tracked path or file outside history spells a retired name (rename_retired_names.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/rename_retired_names.py --check
      # EVERY script self-test, DISCOVERED (kb/Work PB2563): each test_*.py / test_*.ps1 and each script handling
      # --self-test under scripts/ — the hook self-tests, cite.py, ledger_plan.py, landing_check.py and the orchestrator's,
      # which until PB2563 were named here one by one while eleven of them ran nowhere. The same runner is an audit of the
      # local gate (gate.py AUDITS) and a leg of linux-gate.sh. A Windows-only self-test is reported NOT RUN here
      # with its reason and runs in windows-self-tests; one that reads the built assemblies runs in linux-built-self-tests.
      - name: Script self-tests — every self-test under scripts/ and conformance-suite/harness/, discovered (self_tests.py)
        if: ${{ !cancelled() }}
        run: python3 scripts/self_tests.py
      - name: Work register — every kb/Work note well-formed (work.py check)
        if: ${{ !cancelled() }}
        run: python3 scripts/spec/work.py check
      # The conformance suite's generator, refusals only (DESIGN-conformance-suite.md §9; kb/Work PB3174): an audit of
      # the local gate too (gate.py AUDITS), so a refused test is red there first.
      - name: Conformance suite — every test header, rule, control and output well-formed (generate.py --check)
        if: ${{ !cancelled() }}
        run: python3 conformance-suite/harness/generate.py --check
      # The fleet briefs, the pinned PUBLIC skills submodule and `.agent-fleet.json` (kb/Work PB1699). Only the
      # PUBLIC submodule is fetched — never `--recursive`/`submodules: true`, which would pull the private
      # specs-private this job deliberately does without. A brief edit is a docs-only push, so this is where it is checked.
      - name: Fleet practices + pinned public skills (check_practices.py)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init tools/claude-skills
          python3 .claude/skills/workstream/check_practices.py

  # ── ⛔ THE TEST MATRIX IS WEIGHTED SHARDS (kb/Work PB4329, step 6 of PB4323; DESIGN-test-build-ci.md §1.4). Every shard job
  # builds the solution and runs EVERY test assembly (Unit, Characterization, Conformance; and on Linux INV-1-strong) with
  # WISEOWL_COBOL_SHARD=k/N, and the test framework of each host (tests/_shared/GateLegs.cs, GateShard) runs the cases of
  # the test classes the weights file (tests/_shared/test-weights.json, scripts/shard_weights.py generate) deals to shard k:
  # every class the file names, longest first, to the lightest shard so far, then a class it does not name at the file's
  # default weight. No shard filters by NAME, so a new class can never fall between filters, and a stale weight costs the
  # balance, never a case: `ci-gate` checks, per OS and assembly, that the shards' trx ran the discovered population (the
  # one `--list-tests` per OS that shard 1 uploads) exactly once (scripts/test_population.py check). It replaced the
  # name-split matrix of six Conformance shards per OS beside one whole Unit + Characterization job per OS, whose longest
  # job (Windows Unit, 8 minutes of tests) was the merge group's critical path with the Guard job (the NIST corpus through
  # the CLI, 14 minutes), which runs in the nightly workflow now (owner 2026-10-31, kb/Work PB4323 decision 2; PB4332).
  # Linux runs Debug under the inert watch, Windows runs Release (TreatWarningsAsErrors: a new analyzer warning fails the
  # build), as the jobs before them did. ──
  linux-shard:
    name: Linux shard ${{ matrix.shard }}/5
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      # The one narrowing a workflow sets (kb/Work PB4329): `ci-gate` checks the shards' union (test_population.py
      # audit-callers holds a workflow that sets it to that check).
      WISEOWL_COBOL_SHARD: ${{ matrix.shard }}/5
    steps:
      - id: checkout
        uses: actions/checkout@v7
        timeout-minutes: 5
        continue-on-error: true  # one retry follows (kb/Work PB4324)
        with:
          # The specs/ submodule is a private repo and is NOT needed to build or test (only the spec text,
          # referenced from doc comments). Skipping it keeps CI credential-free.
          submodules: false
      - if: steps.checkout.outcome != 'success'
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          submodules: false
      - name: Setup the toolchain (toolchain.env's exact versions, cached; kb/Work PB4007)
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 5
      - name: Restore main's NuGet packages (saved by toolchain-cache alone, kb/Work PB4324)
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      # The external GnuCOBOL corpus is GPL and NEVER committed (.gitignore's licensing block); the population
      # drift gate (PB209) fails loud when it cannot measure the corpus it exists to measure. CI therefore
      # fetches ON DEMAND — the exact contract scripts/fetch-gnucobol-tests.ps1 exists for — pinned and
      # sha256-verified, with the tarball cached so the network is touched only on a cold cache. (kb/Work PB277)
      - name: Restore main's GnuCOBOL testsuite tarball (GPL, fetched on demand, never committed; saved by toolchain-cache alone)
        uses: actions/cache/restore@v6
        with:
          path: tests/external/gnucobol-3.2.tar.xz
          key: gnucobol-tests-3.2-3bb48af4
      - name: Fetch GnuCOBOL testsuite (pinned 3.2, sha256-verified)
        shell: pwsh
        run: ./scripts/fetch-gnucobol-tests.ps1
      # The Frontend's ANTLR generation needs java + pwsh (toolchain.env's, from ./.github/actions/setup-toolchain);
      # Generated/ is a PURE BUILD OUTPUT, untracked since DEVLOG 596 — a fresh checkout always regenerates, and a failed
      # generation FAILS the build.
      - name: Build the solution
        run: dotnet build WiseOwl.Cobol.sln
      # The POPULATIONS every Linux shard's trx is checked against (`ci-gate`), listed once, from shard 1's build.
      - name: List the discovered populations (shard 1; scripts/test_population.py, scrubbed)
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          . scripts/python-resolve.sh
          mkdir -p TestResults/${{ runner.os }}-shard
          for assembly in Unit Characterization Conformance; do
            "$PY" scripts/test_population.py list --project tests/WiseOwl.Cobol.Tests.$assembly/WiseOwl.Cobol.Tests.$assembly.csproj \
              --out TestResults/${{ runner.os }}-shard/$assembly.list.txt
          done
      - name: Unit, this shard
        env:
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-shard/harness-observations.log
        run: python3 scripts/inert_lane.py watch -- dotnet test tests/WiseOwl.Cobol.Tests.Unit/WiseOwl.Cobol.Tests.Unit.csproj --no-build --logger "trx;LogFileName=Unit.trx" --results-directory TestResults/${{ runner.os }}-shard
      # Characterization gate (rearch P0): COMPARES the committed diagnostic + emitted-C# snapshots. CI must NEVER set
      # WISEOWL_COBOL_UPDATE_SNAPSHOTS (that would rewrite them); a real emit/diagnostic change re-seeds locally under review.
      - name: Characterization snapshots (behavior-neutrality gate), this shard
        if: ${{ !cancelled() }}
        env:
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-shard/harness-observations.log
        run: python3 scripts/inert_lane.py watch -- dotnet test tests/WiseOwl.Cobol.Tests.Characterization/WiseOwl.Cobol.Tests.Characterization.csproj --no-build --logger "trx;LogFileName=Characterization.trx" --results-directory TestResults/${{ runner.os }}-shard
      - name: Conformance, this shard
        if: ${{ !cancelled() }}
        env:
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-shard/harness-observations.log
        run: python3 scripts/inert_lane.py watch -- dotnet test tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj --no-build --logger "trx;LogFileName=Conformance.trx" --results-directory TestResults/${{ runner.os }}-shard
      # ── INV-1-STRONG (VERSION_TEST_MATRIX_DESIGN §8; rearch P3 step 8), A STEP OF EVERY LINUX SHARD: the full NIST golden
      # battery must re-run BYTE-EXACT at the shipping default edition in migration mode (--std 2023 --permissive) — the
      # roadmap's fatal-challenge criterion (a construct whose 2023 output differs from its 85 output is an un-gated
      # behavior variant). Each shard re-runs the NIST classes the weights deal it, so `ci-gate` checks the five shards'
      # inv1-strong.trx against the Conformance listing's NistProgram_MatchesGolden cases, case by case (kb/Work PB752:
      # vstest answers a filter that matches nothing with a SILENT GREEN, so the filter's population is checked, never
      # its exit code). ⛔ KEYED ON THE METHOD NAME, NOT `Class.Method` (plan §11 A13): NistDifferentialTests is six
      # partition CLASSES (NistDifferentialTests_P0 …), and `~NistDifferentialTests.NistProgram_MatchesGolden` can never
      # match `NistDifferentialTests_P0.NistProgram_MatchesGolden`. INV-1 permissive CONTINUITY (compile-only, all four
      # editions) is the in-process VersionMatrixTests.Cobol85Program_StillCompilesAtLaterEdition, a Conformance case. ──
      - name: INV-1-strong, this shard (NIST goldens byte-exact at --std 2023 --permissive)
        if: ${{ !cancelled() }}
        env:
          WISEOWL_COBOL_NIST_STD: "2023"
          WISEOWL_COBOL_NIST_PERMISSIVE: "1"
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-shard/harness-observations.log
        run: python3 scripts/inert_lane.py watch -- dotnet test tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj --no-build --filter "FullyQualifiedName~NistProgram_MatchesGolden" --logger "trx;LogFileName=inv1-strong.trx" --results-directory TestResults/${{ runner.os }}-shard
      - name: Upload test results (TRX + shard 1's population listings + harness log)
        if: ${{ always() }}
        uses: ./.github/actions/upload-results
        with:
          name: test-results-${{ runner.os }}-shard-${{ matrix.shard }}
          path: TestResults/${{ runner.os }}-shard/

  # The Windows twin of linux-shard: seven shards, Release, the same weights and the same name check (`ci-gate`).
  # Kept full-population on Windows deliberately: the cross-platform net is load-bearing (the 2026-08-07 BOM break was
  # Windows-caught).
  windows-shard:
    name: Windows shard ${{ matrix.shard }}/7
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    env:
      # The one narrowing a workflow sets (kb/Work PB4329): `ci-gate` checks the shards' union.
      WISEOWL_COBOL_SHARD: ${{ matrix.shard }}/7
    steps:
      - id: checkout
        uses: actions/checkout@v7
        timeout-minutes: 5
        continue-on-error: true  # one retry follows (kb/Work PB4324)
        with:
          submodules: false
      - if: steps.checkout.outcome != 'success'
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          submodules: false
      - name: Setup the toolchain (toolchain.env's exact versions, cached; kb/Work PB4007)
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 5
      - name: Restore main's NuGet packages (saved by toolchain-cache alone, kb/Work PB4324)
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      # GPL corpus fetched on demand for the PB209 population drift gate — see the Linux job's twin. (PB277)
      - name: Restore main's GnuCOBOL testsuite tarball (GPL, fetched on demand, never committed; saved by toolchain-cache alone)
        uses: actions/cache/restore@v6
        with:
          path: tests/external/gnucobol-3.2.tar.xz
          key: gnucobol-tests-3.2-3bb48af4
      - name: Fetch GnuCOBOL testsuite (pinned 3.2, sha256-verified)
        shell: pwsh
        run: ./scripts/fetch-gnucobol-tests.ps1
      - name: Build (Release, warnings-as-errors)
        run: dotnet build WiseOwl.Cobol.sln --configuration Release
      # The POPULATIONS every Windows shard's trx is checked against (`ci-gate`), listed once, from shard 1's build.
      - name: List the discovered populations (shard 1; scripts/test_population.py, scrubbed)
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          . scripts/python-resolve.sh
          mkdir -p TestResults/${{ runner.os }}-shard
          for assembly in Unit Characterization Conformance; do
            "$PY" scripts/test_population.py list --project tests/WiseOwl.Cobol.Tests.$assembly/WiseOwl.Cobol.Tests.$assembly.csproj \
              --configuration Release --out TestResults/${{ runner.os }}-shard/$assembly.list.txt
          done
      - name: Unit, this shard
        env:
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-shard/harness-observations.log
        run: dotnet test tests/WiseOwl.Cobol.Tests.Unit/WiseOwl.Cobol.Tests.Unit.csproj --no-build --configuration Release --logger "trx;LogFileName=Unit.trx" --results-directory TestResults/${{ runner.os }}-shard
      - name: Characterization snapshots (behavior-neutrality gate), this shard
        if: ${{ !cancelled() }}
        env:
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-shard/harness-observations.log
        run: dotnet test tests/WiseOwl.Cobol.Tests.Characterization/WiseOwl.Cobol.Tests.Characterization.csproj --no-build --configuration Release --logger "trx;LogFileName=Characterization.trx" --results-directory TestResults/${{ runner.os }}-shard
      - name: Conformance, this shard
        if: ${{ !cancelled() }}
        env:
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-shard/harness-observations.log
        run: dotnet test tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj --no-build --configuration Release --logger "trx;LogFileName=Conformance.trx" --results-directory TestResults/${{ runner.os }}-shard
      - name: Upload test results (TRX + shard 1's population listings + harness log)
        if: ${{ always() }}
        uses: ./.github/actions/upload-results
        with:
          name: test-results-${{ runner.os }}-shard-${{ matrix.shard }}
          path: TestResults/${{ runner.os }}-shard/

  # The self-tests that read the BUILT assemblies (`SELF-TEST-NEEDS: build`; filter_population.py lists what the
  # Conformance and Unit assemblies discover), which the audits job cannot run (kb/Work PB2563). ITS OWN JOB beside the
  # shards (kb/Work PB4329): as a step of one shard its two minutes would make that shard the merge group's longest, and
  # the weights deal only tests.
  linux-built-self-tests:
    name: Linux post-build script self-tests
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - id: checkout
        uses: actions/checkout@v7
        timeout-minutes: 5
        continue-on-error: true  # one retry follows (kb/Work PB4324)
        with:
          submodules: false
      - if: steps.checkout.outcome != 'success'
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          submodules: false
      - name: Setup the toolchain (toolchain.env's exact versions, cached; kb/Work PB4007)
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 5
      - name: Restore main's NuGet packages (saved by toolchain-cache alone, kb/Work PB4324)
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build the test projects
        run: |
          dotnet build tests/WiseOwl.Cobol.Tests.Unit/WiseOwl.Cobol.Tests.Unit.csproj
          dotnet build tests/WiseOwl.Cobol.Tests.Characterization/WiseOwl.Cobol.Tests.Characterization.csproj
          dotnet build tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj
      - name: Post-build script self-tests (self_tests.py --built)
        run: python3 scripts/self_tests.py --built

  # ── Every script self-test on Windows, the Windows-only ones included (the orchestrator loop's test_orchestrate_*.ps1
  # and test_autostart.ps1), which the Linux audits job reports NOT RUN (kb/Work PB2563). ONLY WHEN THE CHANGE TOUCHES
  # TOOLING (`changes` says so, from scripts/inert_lane.py; kb/Work PB4326): a script self-test reads tooling and the
  # data TOOLING_READS names (a declared population reader and the DEVLOG/kb corpora are the named residue), so no other change
  # turns one red, and the Linux audits job runs every Linux self-test whatever the change. ITS OWN JOB, beside the
  # shards (kb/Work PB3581): the default phase never builds (self_tests.py BUILD), so it waits for no build, and as a
  # step after the Windows test legs it was 7.4 of that job's 16.5 minutes, the merge queue's longest job (merge group
  # run 40004159292: 440 s; the next job ended four minutes earlier). ──
  windows-self-tests:
    name: Windows script self-tests
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true' && needs.changes.outputs.tooling == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - id: checkout
        uses: actions/checkout@v7
        timeout-minutes: 5
        continue-on-error: true  # one retry follows (kb/Work PB4324)
        with:
          submodules: false
      - if: steps.checkout.outcome != 'success'
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          submodules: false
      - name: Setup the toolchain (toolchain.env's exact versions, cached; kb/Work PB4007)
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 5
      # Windows has no system IANA time-zone database, so Python's zoneinfo (scripts/orchestrator/budget.py) needs the
      # tzdata package; the local hosts carry it (2026.4) and actions/setup-python's does not, so every orchestrator
      # self-test went red here and green locally (train 1037t, run 37748130457). Pinned to the local version. PyYAML
      # likewise: tooling_check.py's self-test parses every agent role and skill frontmatter (kb/Work PB3097).
      - name: Python packages for the script self-tests (tzdata, pyyaml, pinned)
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input tzdata==2026.4 pyyaml==6.0.3
      - name: Script self-tests on Windows (self_tests.py)
        shell: pwsh
        run: python scripts/self_tests.py
      # The one line ending over a WINDOWS checkout (kb/Work PB3029): `.gitattributes` makes it LF whatever the runner's
      # `core.autocrlf`, so the bytes the Windows jobs compile and compare are the bytes the Linux jobs read.
      - name: Line endings on a Windows checkout (line_endings.py --check)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python scripts/line_endings.py --check

  # ── ⛔ EVERY CACHE IS SAVED UNDER MAIN, AND BY THE TWO JOBS BELOW ALONE (kb/Work PB3308, PB4007, PB4324;
  # .github/actions/setup-toolchain; CiBoundsDriftTests). A merge group's run restores only what its own ref or main
  # saved, and its ref (`gh-readonly-queue/main/pr-<n>-<sha>`) is new every time, so what a merge group's jobs save is
  # never read again: it only fills the repository's 10 GB cache budget (10.77 GB held on 2026-10-31, every queue branch
  # holding its own NuGet and toolchain copy). The matrix jobs therefore only RESTORE (`actions/cache/restore`), and
  # main's push run, which skips the matrix (the already-verified short-circuit in `changes`), saves on both OSes: the
  # `toolchain-cache` job the toolchain and Python's tool-cache directory, the `package-cache` job the NuGet packages and
  # the GnuCOBOL tarball. Each restores in seconds when main's cache holds it and is installed and saved when not, so a
  # merge group finds them even while a publisher refuses. A warm-up that fails warns and passes: a merge group's own
  # install still tries the publishers, and only a job that uses the tools decides a verdict. ──
  toolchain-cache:
    name: toolchain-cache (${{ matrix.os }})
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - id: checkout
        uses: actions/checkout@v7
        timeout-minutes: 5
        continue-on-error: true  # one retry follows (kb/Work PB4324)
        with:
          submodules: false
          sparse-checkout: |
            .github/actions/setup-toolchain
            toolchain.env
            scripts/install-tool.sh
            scripts/toolchain.py
            scripts/standard_streams.py
            scripts/live_tools.py
            scripts/scratch_repo.py
            global.json
          sparse-checkout-cone-mode: false
      - if: steps.checkout.outcome != 'success'
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          submodules: false
          sparse-checkout: |
            .github/actions/setup-toolchain
            toolchain.env
            scripts/install-tool.sh
            scripts/toolchain.py
            scripts/standard_streams.py
            scripts/live_tools.py
            scripts/scratch_repo.py
            global.json
          sparse-checkout-cone-mode: false
      - id: warm
        name: Setup the toolchain (toolchain.env's exact versions, cached; kb/Work PB4007)
        continue-on-error: true
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 5
      - if: ${{ steps.warm.outcome == 'failure' }}
        shell: bash
        run: echo "::warning::toolchain.env's tools are not in main's cache (their install failed above); a merge group's jobs install them from the publishers"

  # The NuGet packages and the GnuCOBOL testsuite tarball every matrix job restores (the same keys and paths as theirs),
  # saved here under main (see the banner above). A whole checkout (no submodule): the NuGet key hashes every csproj and
  # the solution restores every project. Without the toolchain the job restores nothing: `dotnet` would be the image's.
  package-cache:
    name: package-cache (${{ matrix.os }})
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - id: checkout
        uses: actions/checkout@v7
        timeout-minutes: 5
        continue-on-error: true  # one retry follows (kb/Work PB4324)
        with:
          submodules: false
      - if: steps.checkout.outcome != 'success'
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          submodules: false
      - id: warm
        name: Setup the toolchain (toolchain.env's exact versions, cached; kb/Work PB4007)
        continue-on-error: true
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 5
      - id: nuget
        name: Restore main's NuGet packages
        if: ${{ steps.warm.outcome == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      # A restore that failed partway leaves a partial package set, and nothing re-saves an exact key until a csproj or
      # Directory.Packages.props changes, so the save runs only after a restore that succeeded (kb/Work PB4348).
      - id: restore
        name: Restore the solution's packages (dotnet restore)
        if: ${{ steps.warm.outcome == 'success' && steps.nuget.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: dotnet restore WiseOwl.Cobol.sln
      - name: Save the NuGet packages under main
        if: ${{ steps.restore.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
      # The GnuCOBOL testsuite tarball (GPL, fetched on demand, never committed; kb/Work PB277).
      - id: corpus
        name: Restore main's GnuCOBOL testsuite tarball
        if: ${{ steps.warm.outcome == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: tests/external/gnucobol-3.2.tar.xz
          key: gnucobol-tests-3.2-3bb48af4
      - id: fetch
        name: Fetch the GnuCOBOL testsuite (pinned 3.2, sha256-verified)
        if: ${{ steps.warm.outcome == 'success' && steps.corpus.outputs.cache-hit != 'true' }}
        continue-on-error: true
        shell: pwsh
        run: ./scripts/fetch-gnucobol-tests.ps1
      - name: Save the GnuCOBOL testsuite tarball under main
        if: ${{ steps.fetch.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: tests/external/gnucobol-3.2.tar.xz
          key: gnucobol-tests-3.2-3bb48af4


  # ── ⛔ `ci-gate` IS THE ONE STABLE CHECK NAME `main`'s branch protection REQUIRES (owner decision 2026-09-06
  # on question 23, kb/Work/PB796). Nothing else in this file can be that name:
  #   • the test jobs are MATRICES — their check names carry the shard (`Linux shard 3/5`) and change the day the
  #     shard count does, and a required context that no longer reports blocks every push forever;
  #   • every matrix job is CONDITIONAL — skipped on a docs-only push, which a required check reads as
  #     "never reported", i.e. blocked forever again.
  # This job has ONE name, is `if: always()` so it reports on EVERY run including the docs-only ones, and
  # collapses the whole run into a single verdict. Its needs list is drift-checked by the `changes` job above. It also
  # checks that the shards ran the discovered population exactly once (the step below; it was the separate
  # `conformance-population` job until kb/Work PB4329).
  #
  # ⛔ PASS IS WHITELISTED, NOT BLACKLISTED: `success` and `skipped` pass and EVERYTHING else fails — `failure`
  # and `cancelled` by name today, and any result value GitHub adds tomorrow by construction.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, supersede, audits, linux-shard, windows-shard, linux-built-self-tests, windows-self-tests, toolchain-cache, package-cache]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # The verdict reads `needs` with jq, toolchain.env's (kb/Work PB4007); the checkout is only what its action and the
      # shards' name check read.
      - id: checkout
        uses: actions/checkout@v7
        timeout-minutes: 5
        continue-on-error: true  # one retry follows (kb/Work PB4324)
        with:
          submodules: false
          sparse-checkout: |
            .github/actions/setup-toolchain
            toolchain.env
            scripts/install-tool.sh
            scripts/toolchain.py
            scripts/standard_streams.py
            scripts/live_tools.py
            scripts/scratch_repo.py
            scripts/test_population.py
            .github/actions/download-results
            global.json
          sparse-checkout-cone-mode: false
      - if: steps.checkout.outcome != 'success'
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          submodules: false
          sparse-checkout: |
            .github/actions/setup-toolchain
            toolchain.env
            scripts/install-tool.sh
            scripts/toolchain.py
            scripts/standard_streams.py
            scripts/live_tools.py
            scripts/scratch_repo.py
            scripts/test_population.py
            .github/actions/download-results
            global.json
          sparse-checkout-cone-mode: false
      - name: Setup the toolchain (toolchain.env's exact versions, cached; kb/Work PB4007)
        uses: ./.github/actions/setup-toolchain
        timeout-minutes: 5
      # ── ⛔ THE SHARDS RAN THE POPULATION, EVERY CASE EXACTLY ONCE (kb/Work PB1718, PB4329; DESIGN-test-build-ci.md §1.4,
      # §3.14.4): per OS and test assembly, the UNION of the shards' trx test definitions must equal the discovered
      # population (`--list-tests`, which shard 1 of each OS listed from its own build) as a MULTISET. A weight dealt a
      # class to no shard or to two, or a host that ignored its shard, shows up as named NEVER RAN / RAN TWICE cases, never
      # as silently-untested code; INV-1-strong's five Linux trx are checked against the Conformance listing's
      # NistProgram_MatchesGolden cases the same way. Only when every shard succeeded: it is the "did the shards cover
      # everything" check, not a substitute for their pass/fail, which the verdict below reads. An absent platform or
      # assembly leaves its glob unexpanded: the tool reads no file and exits 2, red, never green. ──
      - name: Download every shard's trx and population listings
        if: needs.changes.outputs.run_matrix == 'true' && needs.linux-shard.result == 'success' && needs.windows-shard.result == 'success'
        uses: ./.github/actions/download-results
        with:
          pattern: test-results-*-shard-*
          path: shards
      - name: The shards' union is exactly the discovered population, per OS and assembly (test_population.py check)
        if: needs.changes.outputs.run_matrix == 'true' && needs.linux-shard.result == 'success' && needs.windows-shard.result == 'success'
        shell: bash
        run: |
          fail=0
          for os in Linux Windows; do
            for assembly in Unit Characterization Conformance; do
              python3 scripts/test_population.py check --label "$assembly ($os shards)" \
                --listing shards/test-results-$os-shard-1/$assembly.list.txt \
                --trx shards/test-results-$os-shard-*/$assembly.trx \
                || { echo "::error::POPULATION MISMATCH ($assembly, $os): the shards' union is not the discovered population — see the names above (a shard whose artifact upload failed after its retries is absent here: its job's warning names it)"; fail=1; }
            done
          done
          python3 scripts/test_population.py check --label "INV-1-strong (Linux shards)" --method NistProgram_MatchesGolden \
            --listing shards/test-results-Linux-shard-1/Conformance.list.txt \
            --trx shards/test-results-Linux-shard-*/inv1-strong.trx \
            || { echo "::error::POPULATION MISMATCH (INV-1-strong): the Linux shards did not re-run every NIST golden exactly once"; fail=1; }
          exit $fail
      - name: Verdict
        if: ${{ !cancelled() }}
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_MATRIX: ${{ needs.changes.outputs.run_matrix }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          set -uo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' | sort > results.txt
          n=$(grep -c . results.txt || true)
          echo "--- needed jobs ($n) ---"; cat results.txt
          # ⛔ A verdict needs its population: had `needs` come back empty this gate would pass over NOTHING
          # and every red would land green (feedback_verdict_evidence_invariant).
          if [ "$n" -lt 5 ]; then
            echo "::error::ci-gate saw only $n needed jobs — it is not measuring this run"
            exit 1
          fi
          bad=$(grep -Ev '=(success|skipped)$' results.txt || true)
          {
            echo "### ci-gate"
            echo
            echo "decision: \`run_matrix\` = **${RUN_MATRIX:-unknown}** — ${REASON:-no reason recorded}"
            echo
            echo '```'
            cat results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$bad" ]; then
            echo "::error::ci-gate FAILS — $(printf '%s' "$bad" | tr '\n' ' ')"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "ci-gate: PASS — every needed job is success or skipped"
