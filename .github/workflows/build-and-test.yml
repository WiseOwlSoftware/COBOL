name: Build and Test

# ⛔ EVERY PUSH RUNS THIS WORKFLOW — there is no `paths-ignore` any more, and there must never be one again.
# `main` carries a REQUIRED status check (`ci-gate`; owner decision 2026-09-06 on question 23, kb/Work/PB796),
# and a required check is satisfied per COMMIT — so a workflow that declines to START leaves the pushed sha with
# no check at all and the protection blocks it FOREVER. `paths-ignore` and branch protection are therefore
# mutually exclusive; measured 2026-09-06, the three docs-only pushes after train 21 produced NO run at all.
# The saving the ignore list bought is kept, one layer down: the `changes` job below decides whether the MATRIX runs,
# from THE INERT LANE (scripts/inert_lane.py, kb/Work PB2878): a change confined to paths no test reads still starts a
# run, but that run is `changes` + `audits` + `ci-gate` and finishes in about a minute. (`audits` is never skipped: an
# inert change is exactly where a wrong citation or a malformed register note arrives.)
on:
  push:
    # `main` — the branch the protection guards, and the branch every instrument already reads
    # (`scripts/session-probe.ps1`, `.claude/skills/gate/SKILL.md`, plan §9 all key on `--branch main`).
    # ⚠ Deliberately NOT `branches: '**'`: up to six implementer worktrees push WIP branches all day
    # (`worktree-agent-*`, `impl/*`), and a two-platform matrix per WIP push is precisely the cost this
    # repository has already refused once (the 2026-08-08 owner flag). Nothing else is pushed to land: main takes
    # only queued pull requests (the ruleset binds administrators, kb/Work PB3024), so the one push this trigger sees
    # is the merge-queue commit main advances to, which its `merge_group` run below already tested.
    branches: [ main ]
  # ── THE MERGE QUEUE (kb/Work PB3024; DESIGN-test-build-ci.md §3.17.2 steps 4–5, §3.17.6). A pull request runs the
  # CHEAP jobs only (`changes`, `audits`, `ci-gate`), so twenty queued PRs never put eighty matrix jobs behind a public
  # repository's 20-concurrent-job limit; the MERGE GROUP (several queued PRs on top of main) runs the matrix and is the
  # one whole-population run each change gets. `ci-gate` is the required check on both; on the group it is the full
  # verdict. The merge-queue commit IS the commit main advances to, so its `push` run takes the already-verified
  # short-circuit in `changes`. ⛔ A pull request's green `ci-gate` is therefore NOT a verdict on the matrix: nothing
  # may merge a PR except the queue, which is why `scripts/orchestrator/enqueue.py` refuses to open or queue one unless
  # `ruleset.py check` reports the queue ACTIVE on main (LandingPipelineDriftTests). ──
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:        # manual trigger — a full-matrix run on demand

# ⛔ A PUSH IS NEVER CANCELLED — ITS RUN IS THAT COMMIT'S ONLY VERDICT. With a required per-commit check a
# cancelled run leaves its sha permanently unlandable (`cancelled` is not `success`), and it is the failure mode
# a human skim reads as "not a failure": PB796 counted SIX cancelled rows inside the 29-hour red window. A
# `pull_request` run, by contrast, is superseded the moment its head moves, so cancelling it costs no coverage
# and saves the minutes this group was added for. A merge group's ref is unique to the group
# (`gh-readonly-queue/main/pr-<n>-<sha>`), so two groups never collide anyway; this expression makes that safety
# explicit instead of incidental. For the same reason no concurrency group can cancel a merge-group run the queue has
# replaced: the `supersede` job does (kb/Work PB3769).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The former single Linux "guard" job ran five heavy activities BACK-TO-BACK (the serial NIST guard → greenfield
# conformance → greenfield unit → CLI build → INV-1 sweep), so wall-clock was their SUM (~17 min). They are now
# separate JOBS that run CONCURRENTLY (wall-clock = the slowest single job), the NIST regression is parallelised
# across cores (guard-fast.sh), and NuGet packages are cached. All jobs are independent gates — a failure in one
# is never masked by another.
#
# ⛔ EVERY LINUX `dotnet test` STEP RUNS UNDER THE INERT WATCH (`python3 scripts/inert_lane.py watch -- dotnet test …`;
# kb/Work PB2878, InertLaneDriftTests): a test that opens a path the inert lane classes as read by no test turns its step
# RED naming the path, so the classification that lets an inert change skip this matrix stays true. The Windows steps
# run the same tests and need no watch of their own (Windows has no open events).
#
# EVERY direct `dotnet test` step also writes a TRX log (--logger trx, --results-directory TestResults/<OS>-<job>/)
# and its job uploads them with `if: always()` as artifact test-results-<OS>-<job> (14-day retention) — a
# red is diagnosable from the artifact without a re-run (kb/Work PB108). The two OSes share shard NAMES, so the
# artifact name carries both; a Conformance shard's is test-results-<OS>-conformance-<shard>, the exact pattern
# the conformance-population job downloads. Each such step also sets WISEOWL_COBOL_HARNESS_LOG to
# <its results directory>/harness-observations.log and its job uploads that file with the TRX: the test harness's every
# retry and non-observation of a child process, with the budget, the work it covered and the host's load, so a
# non-observation on CI is read from the artifact (kb/Work PB3108; CiHarnessLogDriftTests).
#
# ⛔ AN ARTIFACT NEVER DECIDES A VERDICT (kb/Work PB3140; CiArtifactDriftTests): every upload goes through ONE step,
# ./.github/actions/upload-results (tried three times; when all fail it warns and passes), and every download through
# ./.github/actions/download-results (tried three times; the third failure fails the job that needs it). A bare
# actions/upload-artifact step under `always()` once failed a shard whose 5338 tests had all passed, on an artifact
# service ETIMEDOUT, and the merge queue removed the pull request (merge-group run 38502926616, PR #39).
#
# ⛔ NO JOB SETS A VARIABLE THAT NARROWS A TEST RUN (kb/Work PB1718; DESIGN-test-build-ci §3.14.3): the gate's leg
# handshake WISEOWL_COBOL_GATE_*, or VSTest* / RunSettingsFilePath, which MSBuild imports from the environment as the
# VSTest target's filter and run settings. A hosted job's environment is exactly what this file declares, so that
# is how CI scrubs; `python scripts/test_population.py audit-callers` (GateLegDriftTests arm 6) is red on one. The guard job is the exception: its verdict is guard-fast.sh's own NIST-loop
# output, not a `dotnet test` exit.
jobs:
  # ── ⛔ WHETHER THE MATRIX RUNS: THE INERT LANE (kb/Work PB2878; DESIGN-test-build-ci.md §3.18). A path list here used
  # to decide it (`paths-ignore` on the trigger first, which left a sha with no check at all under the required status
  # check, then a doc-only regex in this job); but that list was not a classification: `docs/` and `kb/Work/` are TEST
  # INPUTS, so a change to them skipped the very tests that read them (kb/Work PB3603). The classification now has ONE
  # home, scripts/inert_lane.py, which this job, the local gate and the Linux gate all call, and which the
  # inotify watch on every Linux test step below proves: a test that opens an inert path turns its step RED. ──
  changes:
    name: changes (does this commit need the matrix?)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: read            # for the already-verified short-circuit below — read-only, nothing else
    outputs:
      run_matrix: ${{ steps.decide.outputs.run_matrix }}
      code: ${{ steps.decide.outputs.code }}
      verified: ${{ steps.decide.outputs.verified }}
      reason: ${{ steps.decide.outputs.reason }}
      # What this push proposes to add is `base..sha` — the `audits` job's witness-loss check compares against it.
      # Empty when no honest base exists (a non-push event, an unresolvable `before`); that check then falls back
      # to its own default, the merge-base with origin/main.
      base: ${{ steps.decide.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          # Full history so `git diff <before> <sha>` can resolve BOTH ends (a train pushes several commits at
          # once, so depth 2 is not enough); `filter: blob:none` keeps the fetch to commits and TREES, which is
          # all `--name-only` reads — seconds, not a full clone with every historical blob.
          fetch-depth: 0
          filter: blob:none
      - name: Decide — the inert lane, or does the matrix have to run?
        id: decide
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          # What a merge group or a pull request adds to main is measured from ITS base, not from `before`.
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ZERO=0000000000000000000000000000000000000000
          code=true; verified=false; reason=""; BASE=""
          if [ "$EVENT" = "pull_request" ]; then
            # ⛔ THE CHEAP JOBS ONLY (kb/Work PB3024): the matrix runs on the MERGE GROUP, which tests this PR on top
            # of main together with the others queued. A PR run is `audits` (citations, self-tests, the work register,
            # the fleet practices) and `ci-gate`, and its base is the PR's base for the witness-loss audit.
            code=false
            BASE="${PR_BASE:-}"
            reason="event=pull_request — the matrix runs on the merge group (kb/Work PB3024); this run is the cheap jobs only"
          elif [ "$EVENT" != "push" ] && [ "$EVENT" != "merge_group" ]; then
            reason="event=$EVENT — a dispatch run is always the full matrix"
          else
            if [ "$EVENT" = "merge_group" ]; then
              # The group's base is the head of the group queued AHEAD of it (main itself only for the first), so
              # base..sha is this pull request's own change: the groups ahead were tested by their own runs, and the
              # queue merges a group only after every group ahead of it passed (kb/Work PB3107/PB3123 measured it: run
              # 38360587401's base held entry 1996 before that pull request reached main). A docs-only pull request
              # skips the matrix exactly as a docs-only landing did before the queue. With no resolvable base the
              # matrix runs (below).
              if [ -n "${GROUP_BASE:-}" ] && git cat-file -e "${GROUP_BASE}^{commit}" 2>/dev/null; then
                BASE="$GROUP_BASE"
              fi
            elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$ZERO" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$BEFORE" "$SHA"; then
              BASE="$BEFORE"          # the ordinary case: before..sha IS what this push to main added
            fi
            # (A push is only ever to main — `push.branches` above — so there is no new-branch arm: a `before` the
            # runner cannot resolve leaves BASE empty and the matrix runs, unless the short-circuit below finds the
            # merge group's green run on this very sha.)
            if [ -z "$BASE" ]; then
              reason="no usable base (before=${BEFORE:-<unset>}, ref=$REF) — the matrix runs"
            else
              echo "--- changed paths ($BASE..$SHA) ---"; git diff --name-only --no-renames "$BASE" "$SHA"
              # THE ONE CLASSIFICATION (scripts/inert_lane.py; kb/Work PB2878). An empty diff is the full lane: it is
              # evidence of a no-op or a probe, never that no test reads the change (feedback_verdict_evidence_invariant).
              lane_out="$(python3 scripts/inert_lane.py classify --base "$BASE" --head "$SHA")"
              lane_reason="$(printf '%s\n' "$lane_out" | sed -n 's/^reason=//p')"
              if printf '%s\n' "$lane_out" | grep -qx 'lane=inert'; then
                code=false
                reason="inert lane over $BASE..$SHA: $lane_reason — the matrix is skipped"
              else
                reason="full lane over $BASE..$SHA: ${lane_reason:-$lane_out}"
              fi
            fi
          fi
          # ── THE ALREADY-VERIFIED SHORT-CIRCUIT. The merge queue tests the merge-group commit (`merge_group` run on
          # `gh-readonly-queue/main/...`) and then advances main to THAT SAME SHA; without this, that identical tree
          # would pay for the matrix TWICE per landing — the exact waste the owner flagged on 2026-08-08 over a single
          # spent run. A workflow run is keyed by its head sha, so a green run on this sha is a verdict on this exact
          # tree whatever ref earned it. Any failure of the lookup leaves verified=false and the matrix runs.
          # Measured on the first three queued landings (kb/Work PB3024 item 3): PR 7 → 79d760ab6, PR 8 → 424e699ec,
          # PR 9 → 9d18aa9ab each found its one `merge_group` run green and skipped the matrix on main's `push` run.
          # ⛔ ONLY A RUN THAT COULD HAVE RUN THE MATRIX COUNTS (kb/Work PB3024): a `pull_request` run is the cheap jobs
          # only, and its green `ci-gate` is attached to the PR's head commit — a commit main itself may later point at — so a
          # check-run lookup would read it as a verdict on the matrix. A successful run of THIS workflow (whose
          # `ci-gate` is `if: always()`, so a success run is a green ci-gate) from any event but `pull_request` is.
          if [ "$code" = "true" ] && [ "$EVENT" = "push" ]; then
            n="$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                   --jq '[.workflow_runs[] | select((.path | startswith(".github/workflows/build-and-test.yml"))
                          and .event != "pull_request" and .conclusion == "success")] | length' 2>/dev/null || echo 0)"
            case "$n" in ''|*[!0-9]*) n=0 ;; esac
            if [ "$n" -gt 0 ]; then
              verified=true
              reason="$reason; BUT a non-PR run already succeeded on $SHA ($n green run(s)) — same commit, same tree"
            fi
          fi
          run_matrix=true
          if [ "$code" != "true" ] || [ "$verified" = "true" ]; then run_matrix=false; fi
          reason="$(printf '%s' "$reason" | tr '\n' ' ')"
          {
            echo "run_matrix=$run_matrix"
            echo "code=$code"
            echo "verified=$verified"
            echo "reason=$reason"
            echo "base=$BASE"
          } >> "$GITHUB_OUTPUT"
          echo "run_matrix=$run_matrix (code=$code verified=$verified): $reason"
          {
            echo "### changes"
            echo
            echo "\`run_matrix\` = **$run_matrix**  (code=$code, verified=$verified)"
            echo
            echo "$reason"
          } >> "$GITHUB_STEP_SUMMARY"
      # ── ⛔ THE DRIFT TEST FOR THE GATE ITSELF. `ci-gate` can only block a red it is `needs:`-wired to see, and
      # a job added months from now without that wiring would be a job whose failure lands on main silently —
      # the same shape as PB796 one level down. This asserts, from the workflow file itself, that every job id
      # is in ci-gate's needs list. It runs on EVERY event, docs-only pushes included, because `changes` is the
      # one job that is never skipped. Its own failure branch is exercised, not assumed (see kb/Work/PB796). ──
      - name: Drift — every job in this workflow is a `needs:` of ci-gate
        shell: bash
        run: |
          set -uo pipefail
          wf=.github/workflows/build-and-test.yml
          ids=$(sed -n '/^jobs:$/,$p' "$wf" | sed -nE 's/^  ([A-Za-z0-9_-]+):[[:space:]]*$/\1/p')
          n=$(printf '%s\n' "$ids" | grep -c . || true)
          # ⛔ A selector is evidence about what it RETURNED, never about what it dropped: a parser that finds
          # no jobs must fail loudly, not report "no drift" (feedback_measure_the_selectors_complement).
          if [ "$n" -lt 5 ]; then
            echo "::error::the job-id scan found $n jobs in $wf — the SCANNER is broken, not the workflow"
            exit 1
          fi
          needs_line=$(awk '/^  ci-gate:$/{f=1} f && /^    needs: \[/{print; exit}' "$wf")
          if [ -z "$needs_line" ]; then
            echo "::error::ci-gate has no single-line \`needs: [...]\` — this drift check parses that form"
            exit 1
          fi
          flat=",$(printf '%s' "$needs_line" | sed -E 's/^    needs: \[(.*)\].*/\1/' | tr -d '[:space:]'),"
          missing=""
          for id in $ids; do
            [ "$id" = "ci-gate" ] && continue
            case "$flat" in *",$id,"*) ;; *) missing="$missing $id" ;; esac
          done
          if [ -n "$missing" ]; then
            echo "::error::ci-gate does not need:$missing — a job the gate cannot see is a red that cannot block a landing"
            exit 1
          fi
          echo "drift: ci-gate needs all $((n - 1)) other jobs — $flat"

  # ── SUPERSEDED MERGE-GROUP RUNS ARE CANCELLED, SO THEY RELEASE THEIR RUNNERS (kb/Work PB3769;
  # DESIGN-test-build-ci.md §3.17.2 step 4). When an entry ahead fails or leaves, GitHub rebuilds every group behind it with new commits and new
  # runs, and the old runs kept their runners until they finished (2026-10-25: five such runs after #591's ejection,
  # cancelled by hand). `concurrency` cannot catch them: each group's ref is unique. So every merge-group run starts
  # with this job (no `needs`): it cancels each unfinished merge-group run whose head commit no current queue entry
  # heads, never its own and never a live entry's, and cancels NOTHING when the queue cannot be read whole
  # (scripts/orchestrator/cancel_superseded.py, whose self-test holds every arm). It is the ONE job with `actions:
  # write`, and its step is `continue-on-error`: housekeeping never decides a verdict (LandingPipelineDriftTests). ──
  supersede:
    name: supersede (cancel the merge-group runs the queue replaced)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    permissions:
      actions: write          # cancel a superseded workflow run: this job only
      contents: read          # the sparse checkout of the script
      pull-requests: read     # the merge queue's entries (GraphQL mergeQueue), each a pull request
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          # scripts/standard_streams.py: every orchestrator script imports its one UTF-8 switch (kb/Work PB3637)
          # SparseCheckoutDriftTests (kb/Work PB3787) holds this list: every file the job runs, and every module those
          # import as they start, must be listed, or the continue-on-error step cancels nothing while the run stays green
          sparse-checkout: |
            scripts/orchestrator
            scripts/standard_streams.py
          sparse-checkout-cone-mode: false
      - name: Cancel the superseded merge-group runs (cancel_superseded.py)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: python3 scripts/orchestrator/cancel_superseded.py --repo "$REPO" --run-id "$RUN_ID" --sha "$SHA"

  # ── ⛔ THE STATIC AUDITS — ON EVERY PUSH, DOCS-ONLY PUSHES INCLUDED (kb/Work/PB1574). A wrong clause number is
  # the one defect class no test can fail on (`// MOVE (§14.9.24)` compiles; §14.9.24 is MERGE), so CLAUDE.md
  # rule 1 is enforced by these scripts and nothing else — and until PB1574 they ran only in the local gate
  # and battery phase -1. Every commit that never ran the local gate (a cloud registrar's, a golden lane's, any
  # docs-only landing) therefore reached main unaudited: FOURTEEN wrong or unqualified clause numbers did, and every
  # later wave-local verdict went RED on findings nobody in that wave had written. They run HERE, where `ci-gate`
  # can refuse them, and NOT behind `run_matrix`: `kb/` and `DEVLOG/` are the inert lane's paths, which skip the
  # matrix, and they carry citations.
  # They need no build and no submodule — `specs/ISO_COBOL.md` is tracked in this repository (the private
  # submodule holds only the PDF) — and only the standard library of the runner's python3, which also runs their
  # `--self-test`s inside the Unit leg (`CitationAuditSelfTestDriftTests`), proving each check can still fail.
  # ONE STEP PER AUDIT, each `if: !cancelled()`, so one red never hides the others' verdicts.
  # ⛔ This is the SAME list, in the same order, as the gate driver's (`scripts/run_gate_legs.py` AUDITS) and battery
  # phase -1; the
  # work-register and fleet-practices checks are added because a `kb/` or brief edit is a docs-only push, and
  # nothing else validates it there. ──
  audits:
    name: audits (citations · evidence supersession · witness loss · work register)
    needs: changes
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          # The witness-loss audit reads the inventory AT THE BASE (`git show <base>:…`): full history, blobs
          # fetched on demand — the same partial clone `changes` uses.
          fetch-depth: 0
          filter: blob:none
      # tooling_check.py's self-test proves every agent role and skill definition LOADS by parsing its frontmatter with
      # PyYAML (kb/Work PB3097: an unparseable role printed OK and was never loaded). The local hosts carry PyYAML 6.0.3
      # (Windows pip; under WSL the uv-managed python3.14 that linux-gate.sh runs, installed by scripts/wsl/setup-wsl.sh,
      # and linux-gate.sh is NOT RUN without it); the runner's system Python is not promised it, so it is pinned here.
      - name: Python YAML parser for the tooling self-test (pyyaml, pinned)
        run: python3 -m pip install --user --break-system-packages --disable-pip-version-check --no-input pyyaml==6.0.3
      - name: Code citations — the clause vs the construct it names (audit_code_citations.py --check)
        run: python3 scripts/spec/audit_code_citations.py --check
      - name: Doc citations — a quoted fragment vs the clause it is filed under (audit_doc_citations.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/spec/audit_doc_citations.py --check
      - name: Evidence supersession — a frozen record's claim the tree now contradicts (audit_evidence_supersession.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/spec/audit_evidence_supersession.py --check
      - name: Rendered views — none tracked, every in-tree one gitignored, every generator renders (rendered_views.py --check, kb/Work PB3026)
        if: ${{ !cancelled() }}
        run: python3 scripts/rendered_views.py --check
      - name: Witness loss — inventory evidence dropped since the base of this push (audit_witness_loss.py --check)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          set -euo pipefail
          # `base..sha` is what this push adds (the `changes` job's own decision); with no honest base the audit
          # uses its default, the merge-base with origin/main — present, because the checkout is full-history.
          if [ -n "${BASE:-}" ]; then
            python3 scripts/spec/audit_witness_loss.py --check --base "$BASE"
          else
            python3 scripts/spec/audit_witness_loss.py --check
          fi
      - name: DEVLOG — the landing carries exactly one new, stamped entry file (devlog.py check)
        # Every landing on main carries its one DEVLOG entry (CLAUDE.md rule 6; kb/Work PB2605, PB3025). Checked on what
        # a landing PROPOSES — a pull request or a merge group — against the main it would land on; a push to main
        # (the merge-queue commit) was checked as its merge group, and a dispatch run proposes nothing.
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # a pull request checks out its merge with the CURRENT base, whose first parent is that base
          case "$EVENT" in
            pull_request) BASE="$(git rev-parse HEAD^1)" ;;
            merge_group)  BASE="$MG_BASE" ;;
            *)            echo "devlog step: unexpected event '$EVENT' (the step's if: admits only pull_request and merge_group)"; exit 2 ;;
          esac
          python3 scripts/devlog.py check --base "$BASE" --rev HEAD
      - name: Rule catalog — the unharvested-rule manifest agrees with the transcription (extract_rule_catalog.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/spec/extract_rule_catalog.py --check
      - name: Spec corrections — every flag, Addendum entry, printed form and page agree (verify_publishable.py)
        if: ${{ !cancelled() }}
        run: python3 scripts/spec/verify_publishable.py
      # One line ending, LF (kb/Work PB3029): no tracked text file's blob or checkout holds a CR, and every Python writer
      # states newline=. Here it guards the INDEX (a commit made outside git's attributes); windows-self-tests runs it
      # again over a Windows checkout, the bytes `core.autocrlf` used to turn CRLF.
      - name: Line endings — LF in every tracked text file, index and checkout (line_endings.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/line_endings.py --check
      # No tracked file carries an unresolved merge conflict (kb/Work PB735). An AUDIT since the inert lane (kb/Work
      # PB2878): as a Unit test that read every tracked file it made every path one a test reads, and it never ran in CI
      # on a change whose matrix was skipped.
      - name: Conflict markers — no tracked file carries an unresolved merge conflict (conflict_markers.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/conflict_markers.py --check
      # Every diagnostic code is COBOL####, every number kept (kb/Work PB3575): the rename's own rules asked as a
      # question, so a branch that merged main without converting itself is red here. An audit, not a Unit test, for the
      # reason the conflict-marker check is one (kb/Work PB2878).
      - name: Diagnostic prefix — no tracked file spells a code with the former prefix (rename_diagnostic_prefix.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/rename_diagnostic_prefix.py --check
      # The code carries the product's name, WiseOwl.Cobol (kb/Work PB3837): no tracked path or line outside history spells
      # a retired name. The rename's audit, for the same reason as the two above.
      - name: Retired names — no tracked path or file outside history spells a retired name (rename_retired_names.py --check)
        if: ${{ !cancelled() }}
        run: python3 scripts/rename_retired_names.py --check
      # EVERY script self-test, DISCOVERED (kb/Work PB2563): each test_*.py / test_*.ps1 and each script handling
      # --self-test under scripts/ — the hook self-tests, cite.py, ledger_plan.py, landing_check.py and the orchestrator's,
      # which until PB2563 were named here one by one while eleven of them ran nowhere. The same runner is an audit of the
      # local gate (run_gate_legs.py AUDITS) and a leg of linux-gate.sh. A Windows-only self-test is reported NOT RUN here
      # with its reason and runs in windows-self-tests; one that reads the built assemblies runs in greenfield-unit.
      - name: Script self-tests — every self-test under scripts/ and conformance-suite/harness/, discovered (self_tests.py)
        if: ${{ !cancelled() }}
        run: python3 scripts/self_tests.py
      - name: Work register — every kb/Work note well-formed (work.py check)
        if: ${{ !cancelled() }}
        run: python3 scripts/spec/work.py check
      # The conformance suite's generator, refusals only (DESIGN-conformance-suite.md §9; kb/Work PB3174): an audit of
      # the local gate too (run_gate_legs.py AUDITS), so a refused test is red there first.
      - name: Conformance suite — every test header, rule, control and output well-formed (generate.py --check)
        if: ${{ !cancelled() }}
        run: python3 conformance-suite/harness/generate.py --check
      # The fleet briefs, the pinned PUBLIC skills submodule and `.agent-fleet.json` (kb/Work PB1699). Only the
      # PUBLIC submodule is fetched — never `--recursive`/`submodules: true`, which would pull the private
      # specs-private this job deliberately does without. A brief edit is a docs-only push, so this is where it is checked.
      - name: Fleet practices + pinned public skills (check_practices.py)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init tools/claude-skills
          python3 .claude/skills/workstream/check_practices.py

  # ── The authoritative NIST gate: THE guard, scripts/guard-fast.sh. It builds src/WiseOwl.Cobol.Cli, compiles the ~376
  # NIST CCVS-85 programs its population derives from tests/nist/corpus.tsv, runs each in its own clean directory
  # after exactly its declared predecessors across the runner's cores (JOBS defaults to nproc), and audits every
  # verdict against the manifest (scripts/guard-nist-audit.sh). Linux only — the NIST loop is bash. A non-zero exit
  # (any REGRESSION, DIFF, FAIL*, audit finding, or build warning) fails the job.
  # ⛔ IT MEASURES WiseOwl COBOL (kb/Work/PB750): the NIST leg drives `cobol` (src/WiseOwl.Cobol.Cli), refuses to start
  # if the resolved binary does not reference WiseOwl.Cobol.Compiler, and names the compiler in its
  # `=== NIST (cobol): … ===` line. ──
  guard:
    name: Guard (WiseOwl COBOL NIST, parallel)
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The specs/ submodule is a private repo and is NOT needed to build or test (only the spec text,
          # referenced from doc comments). Skipping it keeps CI credential-free.
          submodules: false
      - name: Setup .NET SDK (the pinned version, cached; kb/Work PB3308)
        uses: ./.github/actions/setup-dotnet
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      # guard-fast.sh restores + builds the compiler under test itself, creates tests/nist/output, and copies the
      # runtime DLL there; a fresh checkout needs no extra prep.
      - name: Run parallel guard (scripts/guard-fast.sh)
        run: bash scripts/guard-fast.sh

  # ── The greenfield WiseOwl COBOL compiler (src/WiseOwl.Cobol.*) suites — the ACTIVE work (the committed differential
  # goldens + the NIST byte-baselines + the version matrix + unit). The guard job's NIST leg drives the same
  # compiler (PB750) over the CLI, from bash, on Linux only; these jobs cover the in-process compile path, both
  # OSes, and everything outside NIST, so they stay a separate gate (DEVLOG 515). Each job builds its own test project(s) then runs --no-build. The
  # Frontend's ANTLR generation needs java + pwsh (both preinstalled on the runner images); Generated/ is a PURE
  # BUILD OUTPUT, untracked since DEVLOG 596 — a fresh checkout always regenerates, and a failed generation
  # FAILS the build. ──
  # ⛔ THE CONFORMANCE SUITE IS SHARDED (kb/Work A14: it was ~23 min as ONE step on a 2-core runner — the whole
  # job's wall time). Three shards, chosen from measured per-class test counts: the version matrix (~2020 light
  # compiles) · the corpus + NIST runners (~820 heavy compile-and-runs) · THE COMPLEMENT — an exclusion filter,
  # so a NEW test class automatically lands in shard "rest" and can never fall between buckets. Each shard
  # publishes its trx and its build's `--list-tests` population; the conformance-population job asserts, on BOTH
  # platforms, that the shards' union IS the discovered population, case by case (scripts/test_population.py) —
  # a filter typo, a class rename or two overlapping filters show up as named NEVER RAN / RAN TWICE cases, never as
  # silently-untested code (feedback_measure_the_selectors_complement).
  greenfield-conformance:
    name: Greenfield conformance (Linux, sharded)
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The version-matrix class alone was 21 min (its continuity method compiles each corpus program at
          # every later edition) — split at the METHOD, the complement arm again exclusion-shaped.
          # Continuity was still ~20 min alone (each case compiles a FULL corpus program): 1047 = 349
          # programs x 3 later editions, and the display name carries `edition: NNNN` (program names are
          # XX###X — a year string cannot collide), so it shards BY EDITION, 349 cases each.
          # ⛔ THE CONTINUITY FILTER IS KEYED ON THE METHOD NAME ALONE, NOT `Class.Method` (plan §11 A13).
          # VersionMatrixTests is now twelve partition CLASSES (VersionMatrixTests_P0 …) so its 2,127 rows stop
          # being one serial xUnit collection; a `~VersionMatrixTests.Cobol85Program_…` substring can never
          # match `VersionMatrixTests_P0.Cobol85Program_…`, and vstest answers a filter that matches nothing
          # with a SILENT GREEN. Cobol85Program_StillCompilesAtLaterEdition is unique in the tree, so keying on
          # it is both correct today and immune to the next re-partition. Every `~VersionMatrixTests`,
          # `~ConformanceSuiteTests` and `~NistDifferentialTests` filter below still matches, partitions included,
          # because each partition class keeps its family name as a prefix.
          - shard: matrix-cont-2002
            filter: "FullyQualifiedName~Cobol85Program_StillCompilesAtLaterEdition&DisplayName~2002"
          - shard: matrix-cont-2014
            filter: "FullyQualifiedName~Cobol85Program_StillCompilesAtLaterEdition&DisplayName~2014"
          - shard: matrix-cont-2023
            filter: "FullyQualifiedName~Cobol85Program_StillCompilesAtLaterEdition&DisplayName~2023"
          - shard: matrix-constructs
            filter: "FullyQualifiedName~VersionMatrixTests&FullyQualifiedName!~Cobol85Program_StillCompilesAtLaterEdition"
          - shard: corpus-nist
            filter: "FullyQualifiedName~ConformanceSuiteTests|FullyQualifiedName~NistDifferentialTests"
          - shard: rest
            filter: "FullyQualifiedName!~VersionMatrixTests&FullyQualifiedName!~ConformanceSuiteTests&FullyQualifiedName!~NistDifferentialTests"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup .NET SDK (the pinned version, cached; kb/Work PB3308)
        uses: ./.github/actions/setup-dotnet
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build the conformance project
        run: dotnet build tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj
      # The POPULATION this shard's trx is checked against, listed from THIS build (conformance-population job).
      - name: List the discovered population (scripts/test_population.py, scrubbed)
        shell: bash
        run: |
          . scripts/python-resolve.sh
          mkdir -p TestResults/${{ runner.os }}-${{ matrix.shard }}
          "$PY" scripts/test_population.py list --project tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj \
            --out TestResults/${{ runner.os }}-${{ matrix.shard }}/conformance.list.txt
      - name: Conformance shard ${{ matrix.shard }}
        shell: bash
        env:
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-${{ matrix.shard }}/harness-observations.log
        run: |
          set -o pipefail
          python3 scripts/inert_lane.py watch -- dotnet test tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj --no-build \
            --filter "${{ matrix.filter }}" \
            --logger "trx;LogFileName=conformance-${{ matrix.shard }}.trx" --results-directory TestResults/${{ runner.os }}-${{ matrix.shard }} \
            2>&1 | tee TestResults/${{ runner.os }}-${{ matrix.shard }}/shard.log
      - name: Upload test results (TRX + population listing + shard log)
        if: ${{ always() }}
        uses: ./.github/actions/upload-results
        with:
          name: test-results-${{ runner.os }}-conformance-${{ matrix.shard }}
          path: TestResults/${{ runner.os }}-${{ matrix.shard }}/

  # Unit + characterization moved OFF the conformance job's critical path (A14 option 1): they are
  # project-granular (nothing hand-listed), so no population guard is needed here.
  greenfield-unit:
    name: Greenfield unit + characterization (Linux)
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup .NET SDK (the pinned version, cached; kb/Work PB3308)
        uses: ./.github/actions/setup-dotnet
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      # The external GnuCOBOL corpus is GPL and NEVER committed (.gitignore's licensing block); the population
      # drift gate (PB209) fails loud when it cannot measure the corpus it exists to measure. CI therefore
      # fetches ON DEMAND — the exact contract scripts/fetch-gnucobol-tests.ps1 exists for — pinned and
      # sha256-verified, with the tarball cached so the network is touched only on a cold cache. (kb/Work PB277)
      - name: Cache GnuCOBOL testsuite tarball (GPL — fetched on demand, never committed)
        uses: actions/cache@v6
        with:
          path: tests/external/gnucobol-3.2.tar.xz
          key: gnucobol-tests-3.2-3bb48af4
      - name: Fetch GnuCOBOL testsuite (pinned 3.2, sha256-verified)
        shell: pwsh
        run: ./scripts/fetch-gnucobol-tests.ps1
      - name: Build greenfield test projects
        run: |
          dotnet build tests/WiseOwl.Cobol.Tests.Unit/WiseOwl.Cobol.Tests.Unit.csproj
          dotnet build tests/WiseOwl.Cobol.Tests.Characterization/WiseOwl.Cobol.Tests.Characterization.csproj
          dotnet build tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj
      - name: Greenfield unit tests
        env:
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-unit/harness-observations.log
        run: python3 scripts/inert_lane.py watch -- dotnet test tests/WiseOwl.Cobol.Tests.Unit/WiseOwl.Cobol.Tests.Unit.csproj --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults/${{ runner.os }}-unit
      # Characterization gate (rearch P0): COMPARES the committed diagnostic + emitted-C# snapshots. CI must NEVER set
      # WISEOWL_COBOL_UPDATE_SNAPSHOTS (that would rewrite them); a real emit/diagnostic change re-seeds locally under review.
      - name: Greenfield characterization snapshots (behavior-neutrality gate)
        env:
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-unit/harness-observations.log
        run: python3 scripts/inert_lane.py watch -- dotnet test tests/WiseOwl.Cobol.Tests.Characterization/WiseOwl.Cobol.Tests.Characterization.csproj --no-build --logger "trx;LogFileName=characterization.trx" --results-directory TestResults/${{ runner.os }}-unit
      # The self-tests that read the BUILT assemblies (`SELF-TEST-NEEDS: build`; filter_population.py lists what the
      # Conformance and Unit assemblies discover), which the audits job cannot run (kb/Work PB2563). After the test
      # legs, so a red self-test never hides their results.
      - name: Post-build script self-tests (self_tests.py --built)
        if: ${{ !cancelled() }}
        run: python3 scripts/self_tests.py --built
      - name: Upload test results (TRX)
        if: ${{ always() }}
        uses: ./.github/actions/upload-results
        with:
          name: test-results-${{ runner.os }}-unit
          path: |
            TestResults/${{ runner.os }}-unit/*.trx
            TestResults/${{ runner.os }}-unit/harness-observations.log

  # The Windows twin of greenfield-conformance — SAME shard filters (the population job checks both platforms'
  # sums), Release config like the rest of the Windows leg. Kept full-suite on Windows deliberately: the
  # cross-platform net is load-bearing (the 2026-08-07 BOM break was Windows-caught).
  windows-conformance:
    name: Windows conformance (sharded)
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The version-matrix class alone was 21 min (its continuity method compiles each corpus program at
          # every later edition) — split at the METHOD, the complement arm again exclusion-shaped.
          # Continuity was still ~20 min alone (each case compiles a FULL corpus program): 1047 = 349
          # programs x 3 later editions, and the display name carries `edition: NNNN` (program names are
          # XX###X — a year string cannot collide), so it shards BY EDITION, 349 cases each.
          # ⛔ THE CONTINUITY FILTER IS KEYED ON THE METHOD NAME ALONE, NOT `Class.Method` (plan §11 A13).
          # VersionMatrixTests is now twelve partition CLASSES (VersionMatrixTests_P0 …) so its 2,127 rows stop
          # being one serial xUnit collection; a `~VersionMatrixTests.Cobol85Program_…` substring can never
          # match `VersionMatrixTests_P0.Cobol85Program_…`, and vstest answers a filter that matches nothing
          # with a SILENT GREEN. Cobol85Program_StillCompilesAtLaterEdition is unique in the tree, so keying on
          # it is both correct today and immune to the next re-partition. Every `~VersionMatrixTests`,
          # `~ConformanceSuiteTests` and `~NistDifferentialTests` filter below still matches, partitions included,
          # because each partition class keeps its family name as a prefix.
          - shard: matrix-cont-2002
            filter: "FullyQualifiedName~Cobol85Program_StillCompilesAtLaterEdition&DisplayName~2002"
          - shard: matrix-cont-2014
            filter: "FullyQualifiedName~Cobol85Program_StillCompilesAtLaterEdition&DisplayName~2014"
          - shard: matrix-cont-2023
            filter: "FullyQualifiedName~Cobol85Program_StillCompilesAtLaterEdition&DisplayName~2023"
          - shard: matrix-constructs
            filter: "FullyQualifiedName~VersionMatrixTests&FullyQualifiedName!~Cobol85Program_StillCompilesAtLaterEdition"
          - shard: corpus-nist
            filter: "FullyQualifiedName~ConformanceSuiteTests|FullyQualifiedName~NistDifferentialTests"
          - shard: rest
            filter: "FullyQualifiedName!~VersionMatrixTests&FullyQualifiedName!~ConformanceSuiteTests&FullyQualifiedName!~NistDifferentialTests"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup .NET SDK (the pinned version, cached; kb/Work PB3308)
        uses: ./.github/actions/setup-dotnet
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build the conformance project (Release)
        run: dotnet build tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj --configuration Release
      # The POPULATION this shard's trx is checked against, listed from THIS (Release, Windows) build.
      - name: List the discovered population (scripts/test_population.py, scrubbed)
        shell: bash
        run: |
          . scripts/python-resolve.sh
          mkdir -p TestResults/${{ runner.os }}-${{ matrix.shard }}
          "$PY" scripts/test_population.py list --project tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj \
            --configuration Release --out TestResults/${{ runner.os }}-${{ matrix.shard }}/conformance.list.txt
      - name: Conformance shard ${{ matrix.shard }}
        shell: bash
        env:
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-${{ matrix.shard }}/harness-observations.log
        run: |
          set -o pipefail
          dotnet test tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj --no-build --configuration Release \
            --filter "${{ matrix.filter }}" \
            --logger "trx;LogFileName=conformance-${{ matrix.shard }}.trx" --results-directory TestResults/${{ runner.os }}-${{ matrix.shard }} \
            2>&1 | tee TestResults/${{ runner.os }}-${{ matrix.shard }}/shard.log
      - name: Upload test results (TRX + population listing + shard log)
        if: ${{ always() }}
        uses: ./.github/actions/upload-results
        with:
          name: test-results-${{ runner.os }}-conformance-${{ matrix.shard }}
          path: TestResults/${{ runner.os }}-${{ matrix.shard }}/

  # ── The shard POPULATION GUARD (kb/Work PB1718; DESIGN-test-build-ci §3.14.4): per platform, the UNION of the
  # shards' trx test definitions must equal the discovered population (`--list-tests`, which every shard listed
  # from its own build) as a MULTISET — every case exactly once. It used to SUM each shard's `Total:` against a
  # `grep -c` of the listing, and a count cannot see a dropped case offset by one that ran twice: two shard filters
  # that overlapped by one test while a third dropped one summed exactly. It is the one tool the battery and the gate
  # use, so the three whole-assembly runs cannot disagree about what "whole" means. Runs only when every shard
  # succeeded — the "did the shards cover everything" check, not a substitute for their pass/fail. No .NET here:
  # the listings come from the shards, so the population is the one the trx files were produced by. ──
  conformance-population:
    name: Conformance shard population guard
    needs: [changes, greenfield-conformance, windows-conformance]
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Download every shard's trx and population listing
        uses: ./.github/actions/download-results
        with:
          pattern: test-results-*-conformance-*
          path: shards
      - name: Assert the shards' union is exactly the discovered population, per platform (test_population.py)
        shell: bash
        run: |
          . scripts/python-resolve.sh
          fail=0
          for os in Linux Windows; do
            # An absent platform leaves its globs unexpanded: the tool reads no file and exits 2 — red, never green.
            "$PY" scripts/test_population.py check --label "Conformance ($os shards)" \
              --listing shards/test-results-$os-conformance-*/conformance.list.txt \
              --trx shards/test-results-$os-conformance-*/*.trx \
              || { echo "::error::POPULATION MISMATCH ($os): the shards' union is not the discovered population — see the names above (a shard whose artifact upload failed after its retries is absent here: its job's warning names it)"; fail=1; }
          done
          exit $fail

  # ── INV-1-STRONG (VERSION_TEST_MATRIX_DESIGN §8; rearch P3 step 8): the full NIST golden battery must re-run
  # BYTE-EXACT at the shipping default edition in migration mode (--std 2023 --permissive) — the roadmap's
  # fatal-challenge criterion (a construct whose 2023 output differs from its 85 output is an un-gated behavior
  # variant). This is the compile-AND-RUN golden re-match. INV-1 permissive CONTINUITY (compile-only, all four
  # editions) is now an IN-PROCESS gate — VersionMatrixTests.Cobol85Program_StillCompilesAtLaterEdition, run in the
  # greenfield-tests job on every commit, cross-platform — so the former out-of-band bash sweep is retired from CI
  # (scripts/version-continuity-sweep.sh remains as a local CLI convenience). ──
  inv1-strong-2023:
    name: INV-1-strong (golden battery byte-exact @ 2023 --permissive)
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup .NET SDK (the pinned version, cached; kb/Work PB3308)
        uses: ./.github/actions/setup-dotnet
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build the conformance project
        run: dotnet build tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj
      # ⛔ KEYED ON THE METHOD NAME, NOT `Class.Method` (plan §11 A13): NistDifferentialTests is now six
      # partition CLASSES (NistDifferentialTests_P0 …), and `~NistDifferentialTests.NistProgram_MatchesGolden`
      # can never match `NistDifferentialTests_P0.NistProgram_MatchesGolden`. vstest answers an unmatched
      # filter with a SILENT GREEN, so this job would have kept reporting success over ZERO goldens.
      # ⛔ AND THE FILTER TEXT BEING RIGHT IS NOT THE SAME AS THE RUN HAVING A POPULATION (kb/Work PB752, the
      # residue PB287 recorded). The sharded conformance matrix is guarded by `conformance-population`; this leg
      # is a single unsharded run, so its guard is per-term: the filter must select a real population or the job
      # fails BEFORE the run, and the selected count (349 goldens today) is printed as that run's population
      # evidence. Needs only python3 and the built project — no submodule, which is why it can live here
      # (`submodules: false`, kb/Work PB159).
      - name: Assert the INV-1-strong filter selects a real population (kb/Work PB752)
        run: python3 scripts/filter_population.py --filter "FullyQualifiedName~NistProgram_MatchesGolden" --filtered tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj
      - name: NIST goldens byte-exact at --std 2023 --permissive (the existing NistDifferentialTests, re-editioned)
        env:
          WISEOWL_COBOL_NIST_STD: "2023"
          WISEOWL_COBOL_NIST_PERMISSIVE: "1"
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-inv1-strong/harness-observations.log
        run: python3 scripts/inert_lane.py watch -- dotnet test tests/WiseOwl.Cobol.Tests.Conformance/WiseOwl.Cobol.Tests.Conformance.csproj --no-build --filter "FullyQualifiedName~NistProgram_MatchesGolden" --logger "trx;LogFileName=inv1-strong.trx" --results-directory TestResults/${{ runner.os }}-inv1-strong
      - name: Upload test results (TRX)
        if: ${{ always() }}
        uses: ./.github/actions/upload-results
        with:
          name: test-results-${{ runner.os }}-inv1-strong
          path: |
            TestResults/${{ runner.os }}-inv1-strong/*.trx
            TestResults/${{ runner.os }}-inv1-strong/harness-observations.log

  # ── Cross-platform sanity: a clean Release build (TreatWarningsAsErrors — a new analyzer warning fails the
  # build) plus the greenfield suites on Windows. The NIST guard is Linux-only (bash), so this job gives the
  # Windows build + managed-test coverage the guard job cannot. ──
  windows-build-test:
    name: Windows build + tests
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup .NET SDK (the pinned version, cached; kb/Work PB3308)
        uses: ./.github/actions/setup-dotnet
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build (Release, warnings-as-errors)
        run: dotnet build WiseOwl.Cobol.sln --configuration Release
      # Greenfield conformance moved to the windows-conformance SHARDED job (kb/Work A14) — same coverage,
      # a third of the wall time; the population guard proves nothing fell between the shards.
      # GPL corpus fetched on demand for the PB209 population drift gate — see the Linux job's twin. (PB277)
      - name: Cache GnuCOBOL testsuite tarball (GPL — fetched on demand, never committed)
        uses: actions/cache@v6
        with:
          path: tests/external/gnucobol-3.2.tar.xz
          key: gnucobol-tests-3.2-3bb48af4
      - name: Fetch GnuCOBOL testsuite (pinned 3.2, sha256-verified)
        shell: pwsh
        run: ./scripts/fetch-gnucobol-tests.ps1
      - name: Greenfield unit tests
        env:
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-build-test/harness-observations.log
        run: dotnet test tests/WiseOwl.Cobol.Tests.Unit/WiseOwl.Cobol.Tests.Unit.csproj --no-build --configuration Release --logger "trx;LogFileName=unit.trx" --results-directory TestResults/${{ runner.os }}-build-test
      - name: Greenfield characterization snapshots (behavior-neutrality gate)
        env:
          WISEOWL_COBOL_HARNESS_LOG: ${{ github.workspace }}/TestResults/${{ runner.os }}-build-test/harness-observations.log
        run: dotnet test tests/WiseOwl.Cobol.Tests.Characterization/WiseOwl.Cobol.Tests.Characterization.csproj --no-build --configuration Release --logger "trx;LogFileName=characterization.trx" --results-directory TestResults/${{ runner.os }}-build-test
      - name: Upload test results (TRX)
        if: ${{ always() }}
        uses: ./.github/actions/upload-results
        with:
          name: test-results-${{ runner.os }}-build-test
          path: |
            TestResults/${{ runner.os }}-build-test/*.trx
            TestResults/${{ runner.os }}-build-test/harness-observations.log

  # ── Every script self-test on Windows, the Windows-only ones included (the orchestrator loop's test_orchestrate_*.ps1
  # and test_autostart.ps1), which the Linux audits job reports NOT RUN (kb/Work PB2563). ITS OWN JOB, beside
  # windows-build-test (kb/Work PB3581): the default phase never builds (self_tests.py BUILD), so it waits for no build,
  # and as a step after windows-build-test's test legs it was 7.4 of that job's 16.5 minutes, the merge queue's longest
  # job (merge group run 40004159292: 440 s; the next job ended four minutes earlier). ──
  windows-self-tests:
    name: Windows script self-tests
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      # Windows has no system IANA time-zone database, so Python's zoneinfo (scripts/orchestrator/budget.py) needs the
      # tzdata package; the local hosts carry it (2026.4) and the runner's Python does not, so every orchestrator
      # self-test went red here and green locally (train 1037t, run 37748130457). Pinned to the local version. PyYAML
      # likewise: tooling_check.py's self-test parses every agent role and skill frontmatter (kb/Work PB3097).
      - name: Python packages for the script self-tests (tzdata, pyyaml, pinned)
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input tzdata==2026.4 pyyaml==6.0.3
      - name: Script self-tests on Windows (self_tests.py)
        shell: pwsh
        run: python scripts/self_tests.py
      # The one line ending over a WINDOWS checkout (kb/Work PB3029): `.gitattributes` makes it LF whatever the runner's
      # `core.autocrlf`, so the bytes the Windows jobs compile and compare are the bytes the Linux jobs read.
      - name: Line endings on a Windows checkout (line_endings.py --check)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python scripts/line_endings.py --check

  # ── ⛔ THE SDK CACHE IS SAVED UNDER MAIN (kb/Work PB3308; .github/actions/setup-dotnet). A merge group's run restores
  # only what its own ref or main saved, and its ref (`gh-readonly-queue/main/pr-<n>-<sha>`) is new every time, so what
  # a merge group's jobs save is never read again; main's push run skips the matrix (the already-verified short-circuit
  # in `changes`), so no building job saves it there either. This job does, on every push to main, on both OSes: it
  # restores the pinned SDK in seconds when main's cache holds it and installs and saves it when not, so a merge group
  # finds it even while every feed refuses. A warm-up that fails warns and passes: a merge group's own install still
  # tries the feeds, and only a building job decides a verdict. ──
  dotnet-sdk-cache:
    name: dotnet-sdk-cache (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          sparse-checkout: |
            .github/actions
            scripts/install-dotnet-sdk.sh
            global.json
          sparse-checkout-cone-mode: false
      - id: warm
        name: Setup .NET SDK (the pinned version, cached; kb/Work PB3308)
        continue-on-error: true
        uses: ./.github/actions/setup-dotnet
      - if: ${{ steps.warm.outcome == 'failure' }}
        shell: bash
        run: echo "::warning::the pinned .NET SDK is not in main's cache (its install failed above); a merge group's jobs install it from the feeds"

  # ── ⛔ `ci-gate` IS THE ONE STABLE CHECK NAME `main`'s branch protection REQUIRES (owner decision 2026-09-06
  # on question 23, kb/Work/PB796). Nothing else in this file can be that name:
  #   • the conformance jobs are MATRICES — their check names carry the shard value (`Greenfield conformance
  #     (Linux, sharded) (corpus-nist)`) and change the day a shard is added or renamed, and a required context
  #     that no longer reports blocks every push forever;
  #   • every matrix job is CONDITIONAL — skipped on a docs-only push, which a required check reads as
  #     "never reported", i.e. blocked forever again.
  # This job has ONE name, is `if: always()` so it reports on EVERY run including the docs-only ones, and
  # collapses the whole run into a single verdict. Its needs list is drift-checked by the `changes` job above.
  #
  # ⛔ PASS IS WHITELISTED, NOT BLACKLISTED: `success` and `skipped` pass and EVERYTHING else fails — `failure`
  # and `cancelled` by name today, and any result value GitHub adds tomorrow by construction.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, supersede, audits, guard, greenfield-conformance, greenfield-unit, windows-conformance, conformance-population, inv1-strong-2023, windows-build-test, windows-self-tests, dotnet-sdk-cache]
    runs-on: ubuntu-26.04
    steps:
      - name: Verdict
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_MATRIX: ${{ needs.changes.outputs.run_matrix }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          set -uo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' | sort > results.txt
          n=$(grep -c . results.txt || true)
          echo "--- needed jobs ($n) ---"; cat results.txt
          # ⛔ A verdict needs its population: had `needs` come back empty this gate would pass over NOTHING
          # and every red would land green (feedback_verdict_evidence_invariant).
          if [ "$n" -lt 5 ]; then
            echo "::error::ci-gate saw only $n needed jobs — it is not measuring this run"
            exit 1
          fi
          bad=$(grep -Ev '=(success|skipped)$' results.txt || true)
          {
            echo "### ci-gate"
            echo
            echo "decision: \`run_matrix\` = **${RUN_MATRIX:-unknown}** — ${REASON:-no reason recorded}"
            echo
            echo '```'
            cat results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$bad" ]; then
            echo "::error::ci-gate FAILS — $(printf '%s' "$bad" | tr '\n' ' ')"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "ci-gate: PASS — every needed job is success or skipped"
