name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel a superseded run on the same ref (a rapid second push) to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The authoritative gate: the full guard (build + unit + integration + the 364 NIST CCVS85 baselines) —
  # exactly what scripts/guard.sh runs locally, the project's "law". Linux only, because the NIST loop is a
  # bash script. A non-zero guard exit (any regression, DIFF, FAIL*, or build warning) fails the job.
  guard:
    name: Guard (build + unit + integration + NIST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The specs/ submodule is a private repo and is NOT needed to build or test (it is only the
          # spec text, referenced from doc comments). Skipping it keeps CI credential-free.
          submodules: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CobolSharp.sln

      # The guard copies the runtime DLL into this directory and writes each test's output there; it is
      # not tracked in git, so a clean checkout must create it before the guard runs.
      - name: Prepare NIST output directory
        run: mkdir -p tests/nist/output

      - name: Run guard (scripts/guard.sh)
        run: bash scripts/guard.sh

      # The greenfield COBOL.NET compiler (src/Cobol.Net.*) and its suites — the ACTIVE work. guard.sh covers only
      # the LEGACY CobolSharp engine, so these are gated separately (DEVLOG 515). They build on demand; CI Linux has
      # pwsh for the Frontend's ANTLR generation step (the committed Generated/*.cs are up to date, so regen is
      # skipped). Separate steps per project so a failure in one is never masked by the other's exit code.
      - name: Greenfield conformance tests (differential + NIST)
        run: dotnet test tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj
      - name: Greenfield unit tests
        run: dotnet test tests/Cobol.Net.Tests.Unit/Cobol.Net.Tests.Unit.csproj

      # INV-1 continuity (VERSION_TEST_MATRIX_DESIGN §3, restated at the P2.7 flip): every 85-compiling NIST
      # program must still compile at 2002/2014/2023 under --permissive — a permissive break is a regression.
      # Wired per the ratified roadmap (Phase 1 CI item; the ISO-validation review found it unowned). The CLI
      # was built by the test steps above (Debug). Fails on any BREAKS line.
      - name: Build greenfield CLI (Debug — the sweep drives cobol.dll)
        run: dotnet build src/Cobol.Net.Cli/Cobol.Net.Cli.csproj
      - name: INV-1 permissive continuity sweep (85-greens × 2002/2014/2023)
        run: |
          bash scripts/version-continuity-sweep.sh 8 | tee sweep.log
          ! grep -q "BREAKS" sweep.log

  # Cross-platform sanity: a clean Release build (TreatWarningsAsErrors — a new analyzer warning fails the
  # build) plus the unit & integration suites on Windows. The NIST guard is Linux-only (bash), so this job
  # gives the Windows build + managed-test coverage the guard job cannot.
  windows-build-test:
    name: Windows build + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CobolSharp.sln

      - name: Build (Release, warnings-as-errors)
        run: dotnet build CobolSharp.sln --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/CobolSharp.Tests.Unit/CobolSharp.Tests.Unit.csproj --no-build --configuration Release

      - name: Integration tests
        run: dotnet test tests/CobolSharp.Tests.Integration/CobolSharp.Tests.Integration.csproj --no-build --configuration Release

      # The greenfield COBOL.NET suites (built by the Release sln build above) — cross-platform coverage on Windows.
      - name: Greenfield conformance tests (differential + NIST)
        run: dotnet test tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj --no-build --configuration Release
      - name: Greenfield unit tests
        run: dotnet test tests/Cobol.Net.Tests.Unit/Cobol.Net.Tests.Unit.csproj --no-build --configuration Release
