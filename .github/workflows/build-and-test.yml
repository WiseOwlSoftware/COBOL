name: Build and Test

# ⛔ EVERY PUSH RUNS THIS WORKFLOW — there is no `paths-ignore` any more, and there must never be one again.
# `main` carries a REQUIRED status check (`ci-gate`; owner decision 2026-09-06 on question 23, kb/Work/PB796),
# and a required check is satisfied per COMMIT — so a workflow that declines to START leaves the pushed sha with
# no check at all and the protection blocks it FOREVER. `paths-ignore` and branch protection are therefore
# mutually exclusive; measured 2026-09-06, the three docs-only pushes after train 21 produced NO run at all.
# The saving the ignore list bought is kept, one layer down: the `changes` job below decides from the SAME path
# list whether the MATRIX runs. A docs-only push still starts a run — but that run is `changes` + `ci-gate` and
# finishes in seconds, so "docs-only pushes do not trigger CI/CD" holds in the sense that costs anything.
on:
  push:
    # `main` — the branch the protection guards, and the branch every instrument already reads
    # (`scripts/session-probe.ps1`, `.claude/skills/gate/SKILL.md`, plan §9 all key on `--branch main`).
    # `ci/**` — the LANDING branches `scripts/push-main.sh` pushes to: a commit is verified on `ci/<short-sha>`
    # FIRST and only fast-forwarded onto main once its `ci-gate` check is green. A check run is attached to the
    # COMMIT, not to a branch, so the verdict earned on `ci/<sha>` is exactly the one the protection reads when
    # that same sha reaches main.
    # ⚠ Deliberately NOT `branches: '**'`: up to six implementer worktrees push WIP branches all day
    # (`worktree-agent-*`, `impl/*`), and a two-platform matrix per WIP push is precisely the cost this
    # repository has already refused once (the 2026-08-08 owner flag).
    branches: [ main, 'ci/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # manual trigger — lets the opt-in legacy-oracle bake-verify cross-check be run on demand
  schedule:
    - cron: '0 6 * * *'     # nightly 06:00 UTC — runs the legacy-oracle cross-check without a legacy run on every PR

# ⛔ A PUSH IS NEVER CANCELLED — ITS RUN IS THAT COMMIT'S ONLY VERDICT. With a required per-commit check a
# cancelled run leaves its sha permanently unlandable (`cancelled` is not `success`), and it is the failure mode
# a human skim reads as "not a failure": PB796 counted SIX cancelled rows inside the 29-hour red window. A
# `pull_request` run, by contrast, is superseded the moment its head moves, so cancelling it costs no coverage
# and saves the minutes this group was added for. Landing branches are sha-named, so they never collide anyway;
# this expression makes that safety explicit instead of incidental.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The former single Linux "guard" job ran five heavy activities BACK-TO-BACK (serial guard.sh → greenfield
# conformance → greenfield unit → CLI build → INV-1 sweep), so wall-clock was their SUM (~17 min). They are now
# separate JOBS that run CONCURRENTLY (wall-clock = the slowest single job), the NIST regression is parallelised
# across cores (guard-fast.sh), and NuGet packages are cached. All jobs are independent gates — a failure in one
# is never masked by another.
#
# EVERY direct `dotnet test` step also writes a TRX log (--logger trx, --results-directory TestResults/<OS>-<job>/)
# and its job uploads them with `if: always()` as artifact test-results-<OS>-<job|shard> (14-day retention) — a
# red is diagnosable from the artifact without a re-run (kb/Work PB108). The two OSes share shard NAMES, so the
# artifact name carries both. The guard job is the exception: its verdict is guard-fast.sh's own NIST-loop
# output, not a `dotnet test` exit.
jobs:
  # ── ⛔ THE ONE PLACE THE DOC-ONLY PATH LIST LIVES. It used to be `paths-ignore` on the push trigger, where it
  # decided whether the workflow RAN AT ALL — incompatible with a required status check (see the header). It now
  # decides whether the MATRIX runs, inside a run that always happens, so every commit gets a `ci-gate` verdict
  # and a docs-only commit still lands in seconds. There is exactly ONE copy of the list (here); the trigger no
  # longer carries a second one for it to drift against (feedback_one_rule_one_place). ──
  changes:
    name: changes (does this commit need the matrix?)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read            # for the already-verified short-circuit below — read-only, nothing else
    outputs:
      run_matrix: ${{ steps.decide.outputs.run_matrix }}
      code: ${{ steps.decide.outputs.code }}
      verified: ${{ steps.decide.outputs.verified }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          # Full history so `git diff <before> <sha>` can resolve BOTH ends (a train pushes several commits at
          # once, so depth 2 is not enough); `filter: blob:none` keeps the fetch to commits and TREES, which is
          # all `--name-only` reads — seconds, not a full clone with every historical blob.
          fetch-depth: 0
          filter: blob:none
      - name: Decide — docs-only, or does the matrix have to run?
        id: decide
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # ⛔ THE DOC-ONLY LIST — exactly the set the retired `paths-ignore` block carried, and nothing else.
          IGNORE='^(DEVLOG\.md|PROMPT\.md|CLAUDE\.md|README\.md|docs/|kb/)'
          ZERO=0000000000000000000000000000000000000000
          code=true; verified=false; reason=""
          if [ "$EVENT" != "push" ]; then
            reason="event=$EVENT — a pull_request / schedule / dispatch run is always the full matrix"
          else
            BASE=""
            if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$ZERO" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$BEFORE" "$SHA"; then
              BASE="$BEFORE"          # the ordinary case: before..sha IS what this push added
            elif [ "$REF" != "refs/heads/main" ]; then
              # A NEW BRANCH — and EVERY `ci/<short-sha>` landing branch is one, so `before` is all zeros on
              # every single landing — or a force push, or a `before` the runner cannot resolve.
              # ⛔ The honest base is then main, not "unknown": what this push proposes to add to main is
              # exactly `merge-base(origin/main, sha)..sha`. Calling a new branch unconditionally code would
              # make EVERY landing run the matrix, docs-only ones included, and this job would buy nothing.
              git rev-parse -q --verify refs/remotes/origin/main >/dev/null 2>&1 \
                || git fetch --no-tags --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main || true
              BASE="$(git merge-base refs/remotes/origin/main "$SHA" 2>/dev/null || true)"
            fi
            if [ -z "$BASE" ]; then
              reason="no usable base (before=${BEFORE:-<unset>}, ref=$REF) — the matrix runs"
            else
              git diff --name-only "$BASE" "$SHA" > changed.txt
              echo "--- changed paths ($BASE..$SHA) ---"; cat changed.txt
              if [ ! -s changed.txt ]; then
                # An empty diff is not evidence of a docs-only change, it is evidence of a no-op or a probe.
                # Fail toward running (feedback_verdict_evidence_invariant: a MISSING observation is not a
                # negative one).
                reason="empty diff over $BASE..$SHA — the matrix runs; an empty diff is not a docs-only proof"
              elif grep -Ev "$IGNORE" changed.txt > code.txt; then
                reason="$(grep -c . code.txt) path(s) outside the doc-only list, e.g. $(head -1 code.txt)"
              else
                code=false
                reason="every changed path is DEVLOG.md / PROMPT.md / CLAUDE.md / README.md / docs/ / kb/ — the matrix is skipped"
              fi
            fi
          fi
          # ── THE ALREADY-VERIFIED SHORT-CIRCUIT. `scripts/push-main.sh` proves a commit on `ci/<sha>` and then
          # fast-forwards THE SAME SHA onto main; without this, that identical tree would pay for the matrix
          # TWICE per landing — the exact waste the owner flagged on 2026-08-08 over a single spent run. A check
          # run is attached to the COMMIT, so a green `ci-gate` on this sha is a verdict on this exact tree
          # whatever branch earned it. Any failure of the lookup leaves verified=false and the matrix runs.
          if [ "$code" = "true" ] && [ "$EVENT" = "push" ]; then
            n="$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ci-gate&per_page=100" \
                   --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)"
            case "$n" in ''|*[!0-9]*) n=0 ;; esac
            if [ "$n" -gt 0 ]; then
              verified=true
              reason="$reason; BUT ci-gate already succeeded on $SHA ($n green check run(s)) — same commit, same tree"
            fi
          fi
          run_matrix=true
          if [ "$code" != "true" ] || [ "$verified" = "true" ]; then run_matrix=false; fi
          reason="$(printf '%s' "$reason" | tr '\n' ' ')"
          {
            echo "run_matrix=$run_matrix"
            echo "code=$code"
            echo "verified=$verified"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "run_matrix=$run_matrix (code=$code verified=$verified): $reason"
          {
            echo "### changes"
            echo
            echo "\`run_matrix\` = **$run_matrix**  (code=$code, verified=$verified)"
            echo
            echo "$reason"
          } >> "$GITHUB_STEP_SUMMARY"
      # ── ⛔ THE DRIFT TEST FOR THE GATE ITSELF. `ci-gate` can only block a red it is `needs:`-wired to see, and
      # a job added months from now without that wiring would be a job whose failure lands on main silently —
      # the same shape as PB796 one level down. This asserts, from the workflow file itself, that every job id
      # is in ci-gate's needs list. It runs on EVERY event, docs-only pushes included, because `changes` is the
      # one job that is never skipped. Its own failure branch is exercised, not assumed (see kb/Work/PB796). ──
      - name: Drift — every job in this workflow is a `needs:` of ci-gate
        shell: bash
        run: |
          set -uo pipefail
          wf=.github/workflows/build-and-test.yml
          ids=$(sed -n '/^jobs:$/,$p' "$wf" | sed -nE 's/^  ([A-Za-z0-9_-]+):[[:space:]]*$/\1/p')
          n=$(printf '%s\n' "$ids" | grep -c . || true)
          # ⛔ A selector is evidence about what it RETURNED, never about what it dropped: a parser that finds
          # no jobs must fail loudly, not report "no drift" (feedback_measure_the_selectors_complement).
          if [ "$n" -lt 5 ]; then
            echo "::error::the job-id scan found $n jobs in $wf — the SCANNER is broken, not the workflow"
            exit 1
          fi
          needs_line=$(awk '/^  ci-gate:$/{f=1} f && /^    needs: \[/{print; exit}' "$wf")
          if [ -z "$needs_line" ]; then
            echo "::error::ci-gate has no single-line \`needs: [...]\` — this drift check parses that form"
            exit 1
          fi
          flat=",$(printf '%s' "$needs_line" | sed -E 's/^    needs: \[(.*)\].*/\1/' | tr -d '[:space:]'),"
          missing=""
          for id in $ids; do
            [ "$id" = "ci-gate" ] && continue
            case "$flat" in *",$id,"*) ;; *) missing="$missing $id" ;; esac
          done
          if [ -n "$missing" ]; then
            echo "::error::ci-gate does not need:$missing — a job the gate cannot see is a red that cannot block a landing"
            exit 1
          fi
          echo "drift: ci-gate needs all $((n - 1)) other jobs — $flat"

  # ── The authoritative NIST gate: the PARALLEL guard. guard-fast.sh runs exactly the checks scripts/guard.sh
  # does (build + unit + integration + the ~376 NIST CCVS-85 programs) but fans the NIST suite across the
  # runner's cores (JOBS defaults to nproc) with a per-suite isolation model PROVEN equivalent to the serial
  # guard by scripts/guard-verify.sh (which diffs the per-test verdicts). Linux only — the NIST loop is bash. A
  # non-zero exit (any REGRESSION, DIFF, FAIL*, or build warning) fails the job.
  # ⛔ IT MEASURES COBOL.NET SINCE kb/Work/PB750. The NIST leg used to drive the LEGACY `cobolsharp.dll`, whose
  # project graph has no code generator, so this job's green said nothing about the shipping compiler; it now
  # drives `cobol` (src/Cobol.Net.Cli), refuses to start if the resolved binary does not reference
  # Cobol.Net.Compiler, and names the compiler in its `=== NIST (cobol): … ===` line. The legacy oracle is
  # reachable through the same leg with COBOLSHARP_LEGACY_DIFFERENTIAL=1 — a differential, never the gate.
  # The legacy unit + integration legs remain: they gate CobolSharp.Compiler and the SHARED Cobol.Net.Frontend. ──
  guard:
    name: Guard (COBOL.NET NIST + legacy unit + integration, parallel)
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The specs/ submodule is a private repo and is NOT needed to build or test (only the spec text,
          # referenced from doc comments). Skipping it keeps CI credential-free.
          submodules: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      # guard-fast.sh restores + builds the compiler under test AND the legacy test projects itself, creates
      # tests/nist/output, and copies the runtime DLL there; a fresh checkout needs no extra prep.
      - name: Run parallel guard (scripts/guard-fast.sh)
        run: bash scripts/guard-fast.sh

  # ── The greenfield COBOL.NET compiler (src/Cobol.Net.*) suites — the ACTIVE work (differential vs the legacy
  # oracle + the NIST byte-baselines + the version matrix + unit). The guard job's NIST leg drives the same
  # compiler (PB750) over the CLI, from bash, on Linux only; these jobs cover the in-process compile path, both
  # OSes, and everything outside NIST, so they stay a separate gate (DEVLOG 515). Each job builds its own test project(s) then runs --no-build. The
  # Frontend's ANTLR generation needs java + pwsh (both preinstalled on the runner images); Generated/ is a PURE
  # BUILD OUTPUT, untracked since DEVLOG 596 — a fresh checkout always regenerates, and a failed generation
  # FAILS the build. ──
  # ⛔ THE CONFORMANCE SUITE IS SHARDED (kb/Work A14: it was ~23 min as ONE step on a 2-core runner — the whole
  # job's wall time). Three shards, chosen from measured per-class test counts: the version matrix (~2020 light
  # compiles) · the corpus + NIST runners (~820 heavy compile-and-runs) · THE COMPLEMENT — an exclusion filter,
  # so a NEW test class automatically lands in shard "rest" and can never fall between buckets. Each shard
  # publishes its executed-test Total; the conformance-population job asserts the shards SUM to the discovered
  # test count on BOTH platforms — a filter typo or a class rename shows up as a loud mismatch, never as
  # silently-untested code (feedback_measure_the_selectors_complement).
  greenfield-conformance:
    name: Greenfield conformance (Linux, sharded)
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The version-matrix class alone was 21 min (its continuity method compiles each corpus program at
          # every later edition) — split at the METHOD, the complement arm again exclusion-shaped.
          # Continuity was still ~20 min alone (each case compiles a FULL corpus program): 1047 = 349
          # programs x 3 later editions, and the display name carries `edition: NNNN` (program names are
          # XX###X — a year string cannot collide), so it shards BY EDITION, 349 cases each.
          # ⛔ THE CONTINUITY FILTER IS KEYED ON THE METHOD NAME ALONE, NOT `Class.Method` (plan §11 A13).
          # VersionMatrixTests is now twelve partition CLASSES (VersionMatrixTests_P0 …) so its 2,127 rows stop
          # being one serial xUnit collection; a `~VersionMatrixTests.Cobol85Program_…` substring can never
          # match `VersionMatrixTests_P0.Cobol85Program_…`, and vstest answers a filter that matches nothing
          # with a SILENT GREEN. Cobol85Program_StillCompilesAtLaterEdition is unique in the tree, so keying on
          # it is both correct today and immune to the next re-partition. Every `~VersionMatrixTests`,
          # `~CorpusRunnerTests` and `~NistDifferentialTests` filter below still matches, partitions included,
          # because each partition class keeps its family name as a prefix.
          - shard: matrix-cont-2002
            filter: "FullyQualifiedName~Cobol85Program_StillCompilesAtLaterEdition&DisplayName~2002"
          - shard: matrix-cont-2014
            filter: "FullyQualifiedName~Cobol85Program_StillCompilesAtLaterEdition&DisplayName~2014"
          - shard: matrix-cont-2023
            filter: "FullyQualifiedName~Cobol85Program_StillCompilesAtLaterEdition&DisplayName~2023"
          - shard: matrix-constructs
            filter: "FullyQualifiedName~VersionMatrixTests&FullyQualifiedName!~Cobol85Program_StillCompilesAtLaterEdition"
          - shard: corpus-nist
            filter: "FullyQualifiedName~CorpusRunnerTests|FullyQualifiedName~NistDifferentialTests"
          - shard: rest
            filter: "FullyQualifiedName!~VersionMatrixTests&FullyQualifiedName!~CorpusRunnerTests&FullyQualifiedName!~NistDifferentialTests"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build the conformance project
        run: dotnet build tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj
      - name: Conformance shard ${{ matrix.shard }}
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj --no-build \
            --filter "${{ matrix.filter }}" \
            --logger "trx;LogFileName=conformance-${{ matrix.shard }}.trx" --results-directory TestResults/${{ runner.os }}-${{ matrix.shard }} \
            2>&1 | tee shard.log
          grep -Eo 'Total:[[:space:]]+[0-9]+' shard.log | tail -1 | grep -Eo '[0-9]+' > count.txt
          echo "shard ${{ matrix.shard }} executed $(cat count.txt) tests"
      - name: Publish shard count
        uses: actions/upload-artifact@v7
        with:
          name: shard-count-${{ runner.os }}-${{ matrix.shard }}
          path: count.txt
      - name: Upload test results (TRX + shard log)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}-${{ matrix.shard }}
          path: |
            TestResults/${{ runner.os }}-${{ matrix.shard }}/*.trx
            shard.log
          if-no-files-found: ignore
          retention-days: 14

  # Unit + characterization moved OFF the conformance job's critical path (A14 option 1): they are
  # project-granular (nothing hand-listed), so no population guard is needed here.
  greenfield-unit:
    name: Greenfield unit + characterization (Linux)
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      # The external GnuCOBOL corpus is GPL and NEVER committed (.gitignore's licensing block); the population
      # drift gate (PB209) fails loud when it cannot measure the corpus it exists to measure. CI therefore
      # fetches ON DEMAND — the exact contract scripts/fetch-gnucobol-tests.ps1 exists for — pinned and
      # sha256-verified, with the tarball cached so the network is touched only on a cold cache. (kb/Work PB277)
      - name: Cache GnuCOBOL testsuite tarball (GPL — fetched on demand, never committed)
        uses: actions/cache@v6
        with:
          path: tests/external/gnucobol-3.2.tar.xz
          key: gnucobol-tests-3.2-3bb48af4
      - name: Fetch GnuCOBOL testsuite (pinned 3.2, sha256-verified)
        shell: pwsh
        run: ./scripts/fetch-gnucobol-tests.ps1
      - name: Build greenfield test projects
        run: |
          dotnet build tests/Cobol.Net.Tests.Unit/Cobol.Net.Tests.Unit.csproj
          dotnet build tests/Cobol.Net.Tests.Characterization/Cobol.Net.Tests.Characterization.csproj
      - name: Greenfield unit tests
        run: dotnet test tests/Cobol.Net.Tests.Unit/Cobol.Net.Tests.Unit.csproj --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults/${{ runner.os }}-unit
      # Characterization gate (rearch P0): COMPARES the committed diagnostic + emitted-C# snapshots. CI must NEVER set
      # COBOLNET_UPDATE_SNAPSHOTS (that would rewrite them); a real emit/diagnostic change re-seeds locally under review.
      - name: Greenfield characterization snapshots (behavior-neutrality gate)
        run: dotnet test tests/Cobol.Net.Tests.Characterization/Cobol.Net.Tests.Characterization.csproj --no-build --logger "trx;LogFileName=characterization.trx" --results-directory TestResults/${{ runner.os }}-unit
      - name: Upload test results (TRX)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}-unit
          path: TestResults/${{ runner.os }}-unit/*.trx
          if-no-files-found: ignore
          retention-days: 14

  # The Windows twin of greenfield-conformance — SAME shard filters (the population job checks both platforms'
  # sums), Release config like the rest of the Windows leg. Kept full-suite on Windows deliberately: the
  # cross-platform net is load-bearing (the 2026-08-07 BOM break was Windows-caught).
  windows-conformance:
    name: Windows conformance (sharded)
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The version-matrix class alone was 21 min (its continuity method compiles each corpus program at
          # every later edition) — split at the METHOD, the complement arm again exclusion-shaped.
          # Continuity was still ~20 min alone (each case compiles a FULL corpus program): 1047 = 349
          # programs x 3 later editions, and the display name carries `edition: NNNN` (program names are
          # XX###X — a year string cannot collide), so it shards BY EDITION, 349 cases each.
          # ⛔ THE CONTINUITY FILTER IS KEYED ON THE METHOD NAME ALONE, NOT `Class.Method` (plan §11 A13).
          # VersionMatrixTests is now twelve partition CLASSES (VersionMatrixTests_P0 …) so its 2,127 rows stop
          # being one serial xUnit collection; a `~VersionMatrixTests.Cobol85Program_…` substring can never
          # match `VersionMatrixTests_P0.Cobol85Program_…`, and vstest answers a filter that matches nothing
          # with a SILENT GREEN. Cobol85Program_StillCompilesAtLaterEdition is unique in the tree, so keying on
          # it is both correct today and immune to the next re-partition. Every `~VersionMatrixTests`,
          # `~CorpusRunnerTests` and `~NistDifferentialTests` filter below still matches, partitions included,
          # because each partition class keeps its family name as a prefix.
          - shard: matrix-cont-2002
            filter: "FullyQualifiedName~Cobol85Program_StillCompilesAtLaterEdition&DisplayName~2002"
          - shard: matrix-cont-2014
            filter: "FullyQualifiedName~Cobol85Program_StillCompilesAtLaterEdition&DisplayName~2014"
          - shard: matrix-cont-2023
            filter: "FullyQualifiedName~Cobol85Program_StillCompilesAtLaterEdition&DisplayName~2023"
          - shard: matrix-constructs
            filter: "FullyQualifiedName~VersionMatrixTests&FullyQualifiedName!~Cobol85Program_StillCompilesAtLaterEdition"
          - shard: corpus-nist
            filter: "FullyQualifiedName~CorpusRunnerTests|FullyQualifiedName~NistDifferentialTests"
          - shard: rest
            filter: "FullyQualifiedName!~VersionMatrixTests&FullyQualifiedName!~CorpusRunnerTests&FullyQualifiedName!~NistDifferentialTests"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build the conformance project (Release)
        run: dotnet build tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj --configuration Release
      - name: Conformance shard ${{ matrix.shard }}
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj --no-build --configuration Release \
            --filter "${{ matrix.filter }}" \
            --logger "trx;LogFileName=conformance-${{ matrix.shard }}.trx" --results-directory TestResults/${{ runner.os }}-${{ matrix.shard }} \
            2>&1 | tee shard.log
          grep -Eo 'Total:[[:space:]]+[0-9]+' shard.log | tail -1 | grep -Eo '[0-9]+' > count.txt
          echo "shard ${{ matrix.shard }} executed $(cat count.txt) tests"
      - name: Publish shard count
        uses: actions/upload-artifact@v7
        with:
          name: shard-count-${{ runner.os }}-${{ matrix.shard }}
          path: count.txt
      - name: Upload test results (TRX + shard log)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}-${{ matrix.shard }}
          path: |
            TestResults/${{ runner.os }}-${{ matrix.shard }}/*.trx
            shard.log
          if-no-files-found: ignore
          retention-days: 14

  # ── The shard POPULATION GUARD: discovery is re-derived (`--list-tests`), and each platform's shard Totals
  # must SUM to it exactly. Runs only when every shard succeeded — it is the "did the shards cover everything"
  # check, not a substitute for their pass/fail. A theory whose cases cannot enumerate at discovery time would
  # trip this loudly; that is the safe direction (a false red, never a silent gap). ──
  conformance-population:
    name: Conformance shard population guard
    needs: [changes, greenfield-conformance, windows-conformance]
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build the conformance project
        run: dotnet build tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj
      - name: Download shard counts
        uses: actions/download-artifact@v8
        with:
          pattern: shard-count-*
          path: counts
      - name: Assert the shards sum to the discovered population, per platform
        shell: bash
        run: |
          disc=$(dotnet test tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj --no-build \
                   --list-tests 2>/dev/null | grep -cE '^    CobolNet\.Tests\.Conformance\.')
          echo "discovered: $disc"
          fail=0
          for os in Linux Windows; do
            sum=0
            for f in counts/shard-count-$os-*/count.txt; do
              n=$(cat "$f"); echo "$f: $n"; sum=$((sum + n))
            done
            echo "$os shard sum: $sum"
            if [ "$sum" -ne "$disc" ]; then
              echo "::error::POPULATION MISMATCH ($os): shards executed $sum of $disc discovered tests — a shard filter is dropping or double-counting tests"
              fail=1
            fi
          done
          exit $fail

  # ── INV-1-STRONG (VERSION_TEST_MATRIX_DESIGN §8; rearch P3 step 8): the full NIST golden battery must re-run
  # BYTE-EXACT at the shipping default edition in migration mode (--std 2023 --permissive) — the roadmap's
  # fatal-challenge criterion (a construct whose 2023 output differs from its 85 output is an un-gated behavior
  # variant). This is the compile-AND-RUN golden re-match. INV-1 permissive CONTINUITY (compile-only, all four
  # editions) is now an IN-PROCESS gate — VersionMatrixTests.Cobol85Program_StillCompilesAtLaterEdition, run in the
  # greenfield-tests job on every commit, cross-platform — so the former out-of-band bash sweep is retired from CI
  # (scripts/version-continuity-sweep.sh remains as a local CLI convenience). ──
  inv1-strong-2023:
    name: INV-1-strong (golden battery byte-exact @ 2023 --permissive)
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build the conformance project
        run: dotnet build tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj
      # ⛔ KEYED ON THE METHOD NAME, NOT `Class.Method` (plan §11 A13): NistDifferentialTests is now six
      # partition CLASSES (NistDifferentialTests_P0 …), and `~NistDifferentialTests.NistProgram_MatchesGolden`
      # can never match `NistDifferentialTests_P0.NistProgram_MatchesGolden`. vstest answers an unmatched
      # filter with a SILENT GREEN, so this job would have kept reporting success over ZERO goldens.
      # ⛔ AND THE FILTER TEXT BEING RIGHT IS NOT THE SAME AS THE RUN HAVING A POPULATION (kb/Work PB752, the
      # residue PB287 recorded). The sharded conformance matrix is guarded by `conformance-population`; this leg
      # is a single unsharded run, so its guard is per-term: the filter must select a real population or the job
      # fails BEFORE the run, and the selected count (349 goldens today) is printed as that run's population
      # evidence. Needs only python3 and the built project — no submodule, which is why it can live here
      # (`submodules: false`, kb/Work PB159).
      - name: Assert the INV-1-strong filter selects a real population (kb/Work PB752)
        run: python3 scripts/filter_population.py --filter "FullyQualifiedName~NistProgram_MatchesGolden" --filtered tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj
      - name: NIST goldens byte-exact at --std 2023 --permissive (the existing NistDifferentialTests, re-editioned)
        env:
          COBOLNET_NIST_STD: "2023"
          COBOLNET_NIST_PERMISSIVE: "1"
        run: dotnet test tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj --no-build --filter "FullyQualifiedName~NistProgram_MatchesGolden" --logger "trx;LogFileName=inv1-strong.trx" --results-directory TestResults/${{ runner.os }}-inv1-strong
      - name: Upload test results (TRX)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}-inv1-strong
          path: TestResults/${{ runner.os }}-inv1-strong/*.trx
          if-no-files-found: ignore
          retention-days: 14

  # ── Cross-platform sanity: a clean Release build (TreatWarningsAsErrors — a new analyzer warning fails the
  # build) plus the legacy + greenfield suites on Windows. The NIST guard is Linux-only (bash), so this job gives
  # the Windows build + managed-test coverage the guard job cannot. ──
  windows-build-test:
    name: Windows build + tests
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build (Release, warnings-as-errors)
        run: dotnet build CobolSharp.sln --configuration Release
      - name: Unit tests
        run: dotnet test tests/CobolSharp.Tests.Unit/CobolSharp.Tests.Unit.csproj --no-build --configuration Release --logger "trx;LogFileName=legacy-unit.trx" --results-directory TestResults/${{ runner.os }}-build-test
      - name: Integration tests
        run: dotnet test tests/CobolSharp.Tests.Integration/CobolSharp.Tests.Integration.csproj --no-build --configuration Release --logger "trx;LogFileName=legacy-integration.trx" --results-directory TestResults/${{ runner.os }}-build-test
      # Greenfield conformance moved to the windows-conformance SHARDED job (kb/Work A14) — same coverage,
      # a third of the wall time; the population guard proves nothing fell between the shards.
      # GPL corpus fetched on demand for the PB209 population drift gate — see the Linux job's twin. (PB277)
      - name: Cache GnuCOBOL testsuite tarball (GPL — fetched on demand, never committed)
        uses: actions/cache@v6
        with:
          path: tests/external/gnucobol-3.2.tar.xz
          key: gnucobol-tests-3.2-3bb48af4
      - name: Fetch GnuCOBOL testsuite (pinned 3.2, sha256-verified)
        shell: pwsh
        run: ./scripts/fetch-gnucobol-tests.ps1
      - name: Greenfield unit tests
        run: dotnet test tests/Cobol.Net.Tests.Unit/Cobol.Net.Tests.Unit.csproj --no-build --configuration Release --logger "trx;LogFileName=unit.trx" --results-directory TestResults/${{ runner.os }}-build-test
      - name: Greenfield characterization snapshots (behavior-neutrality gate)
        run: dotnet test tests/Cobol.Net.Tests.Characterization/Cobol.Net.Tests.Characterization.csproj --no-build --configuration Release --logger "trx;LogFileName=characterization.trx" --results-directory TestResults/${{ runner.os }}-build-test
      - name: Upload test results (TRX)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}-build-test
          path: TestResults/${{ runner.os }}-build-test/*.trx
          if-no-files-found: ignore
          retention-days: 14

  # ── The opt-in legacy-oracle bake-verify cross-check (rearch P0). The normal battery now compares COBOL.NET to the
  # COMMITTED goldens under tests/differential/ (COBOLNET_DIFF_MODE=golden, the default) and never runs the legacy
  # engine — so the greenfield jobs above stay green after the G8 deletion of CobolSharp.Compiler. This job re-proves
  # the goldens still equal a LIVE legacy run (COBOLNET_DIFF_MODE=verify asserts cobolnet == legacy AND cobolnet ==
  # golden for every converted differential case), which is the whole point of keeping the legacy engine alive through
  # the rearchitecture. It runs NIGHTLY + on manual dispatch (NOT on every PR — that would re-couple CI to the legacy
  # engine, undoing this phase). DELETED at G8 together with the legacy projects, not now. ──
  legacy-oracle:
    name: Legacy-oracle bake-verify cross-check (opt-in — nightly / manual)
    needs: changes
    if: needs.changes.outputs.run_matrix == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build the conformance project (drives both engines)
        run: dotnet build tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj
      # ⛔ THE EXCLUSION IS THE HALF THAT ROTS SILENTLY (kb/Work PB752). A dead POSITIVE term makes this leg run
      # nothing and still exit 0; a dead NEGATION quietly stops excluding and drags the NIST families back in.
      # The guard probes a negated term through its POSITIVE form — asking vstest for `!~X` returns the whole
      # assembly and would call a stale exclusion live — so both halves of this two-term filter are asserted.
      # This leg runs on schedule/dispatch only, so a silent zero-test run here is seen by fewer people.
      - name: Assert the legacy-oracle filter selects a real population (kb/Work PB752)
        run: python3 scripts/filter_population.py --filter "FullyQualifiedName~DifferentialTests&FullyQualifiedName!~NistDifferentialTests" --filtered tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj
      # verify mode: each converted funnel asserts cobolnet == legacy AND cobolnet == golden — a live-legacy run must
      # still match every baked golden. Nist* excluded (it compares to NIST goldens directly, not via DifferentialGolden).
      - name: Differential verify (cobolnet == legacy == golden)
        env:
          COBOLNET_DIFF_MODE: verify
        run: dotnet test tests/Cobol.Net.Tests.Conformance/Cobol.Net.Tests.Conformance.csproj --no-build --filter "FullyQualifiedName~DifferentialTests&FullyQualifiedName!~NistDifferentialTests" --logger "trx;LogFileName=legacy-oracle.trx" --results-directory TestResults/${{ runner.os }}-legacy-oracle
      - name: Upload test results (TRX)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}-legacy-oracle
          path: TestResults/${{ runner.os }}-legacy-oracle/*.trx
          if-no-files-found: ignore
          retention-days: 14

  # ── ⛔ `ci-gate` IS THE ONE STABLE CHECK NAME `main`'s branch protection REQUIRES (owner decision 2026-09-06
  # on question 23, kb/Work/PB796). Nothing else in this file can be that name:
  #   • the conformance jobs are MATRICES — their check names carry the shard value (`Greenfield conformance
  #     (Linux, sharded) (corpus-nist)`) and change the day a shard is added or renamed, and a required context
  #     that no longer reports blocks every push forever;
  #   • every matrix job is CONDITIONAL — skipped on a docs-only push, which a required check reads as
  #     "never reported", i.e. blocked forever again.
  # This job has ONE name, is `if: always()` so it reports on EVERY run including the docs-only ones, and
  # collapses the whole run into a single verdict. Its needs list is drift-checked by the `changes` job above.
  #
  # ⛔ PASS IS WHITELISTED, NOT BLACKLISTED: `success` and `skipped` pass and EVERYTHING else fails — `failure`
  # and `cancelled` by name today, and any result value GitHub adds tomorrow by construction.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, guard, greenfield-conformance, greenfield-unit, windows-conformance, conformance-population, inv1-strong-2023, windows-build-test, legacy-oracle]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_MATRIX: ${{ needs.changes.outputs.run_matrix }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          set -uo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' | sort > results.txt
          n=$(grep -c . results.txt || true)
          echo "--- needed jobs ($n) ---"; cat results.txt
          # ⛔ A verdict needs its population: had `needs` come back empty this gate would pass over NOTHING
          # and every red would land green (feedback_verdict_evidence_invariant).
          if [ "$n" -lt 5 ]; then
            echo "::error::ci-gate saw only $n needed jobs — it is not measuring this run"
            exit 1
          fi
          bad=$(grep -Ev '=(success|skipped)$' results.txt || true)
          {
            echo "### ci-gate"
            echo
            echo "decision: \`run_matrix\` = **${RUN_MATRIX:-unknown}** — ${REASON:-no reason recorded}"
            echo
            echo '```'
            cat results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$bad" ]; then
            echo "::error::ci-gate FAILS — $(printf '%s' "$bad" | tr '\n' ' ')"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "ci-gate: PASS — every needed job is success or skipped"
