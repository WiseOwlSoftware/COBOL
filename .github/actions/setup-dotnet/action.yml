# ⛔ THE ONE WAY A JOB OF THIS REPOSITORY GETS ITS .NET SDK (kb/Work PB3308; DotnetSdkInstallDriftTests).
#
# The SDK is the exact version scripts/install-dotnet-sdk.sh pins, restored from the Actions cache when it is there
# and otherwise downloaded by that script (the feeds in its order, each archive checked against its `.sha512`), then
# saved to the cache and put first on PATH. The step fails when no cache and no feed has the SDK, and when `dotnet`
# then reports any version but the pinned one.
#
# Before this, every building job ran `actions/setup-dotnet` with `dotnet-version: 10.0.x`: it resolved "the newest
# 10.0" through the aka.ms redirect on every job, with no cache. One dropped transfer failed a job (merge-group run
# 38974314534, 2026-10-16), and from about 18:50Z on 2026-10-25 the redirect's storage origin answered
# `409 PublicAccessNotPermitted`, so every code merge group failed `Setup .NET 10` while builds.dotnet.microsoft.com
# served the same SDK.
#
# The cache is keyed on the version, the OS and the architecture. A merge group's run restores what its own ref or main
# saved, and its ref is new every time, so the `dotnet-sdk-cache` job of build-and-test.yml saves the SDK under main on
# every push to main: a merge group then finds it even while every feed refuses. A cache restore or save that fails
# only warns.
name: Setup .NET SDK
description: Install the repository's pinned .NET SDK from the cache, else from its feeds, and put it first on PATH.
runs:
  using: composite
  steps:
    - id: sdk
      shell: bash
      env:
        TOOL_CACHE: ${{ runner.tool_cache }}
      run: |
        set -euo pipefail
        version=$(bash scripts/install-dotnet-sdk.sh --version)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "dir=$TOOL_CACHE/dotnet-sdk/$version" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.sdk.outputs.dir }}
        key: dotnet-sdk-${{ steps.sdk.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
    - name: Install the pinned SDK (a no-op when the cache restored it)
      shell: bash
      env:
        DIR: ${{ steps.sdk.outputs.dir }}
      run: bash scripts/install-dotnet-sdk.sh "$DIR"
    - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.sdk.outputs.dir }}
        key: dotnet-sdk-${{ steps.sdk.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
    - name: Put the SDK first on PATH, and prove `dotnet` is the pinned version
      shell: bash
      env:
        DIR: ${{ steps.sdk.outputs.dir }}
        VERSION: ${{ steps.sdk.outputs.version }}
      run: |
        set -euo pipefail
        echo "DOTNET_ROOT=$DIR" >> "$GITHUB_ENV"
        echo "$DIR" >> "$GITHUB_PATH"
        exe="$DIR/dotnet"
        # Git Bash on Windows: the runner's C:\… path, in the POSIX form bash executes.
        if command -v cygpath > /dev/null; then exe=$(cygpath -u "$exe"); fi
        got=$("$exe" --version)
        if [ "$got" != "$VERSION" ]; then
          echo "::error::dotnet in $DIR reports SDK $got, not the pinned $VERSION (scripts/install-dotnet-sdk.sh, global.json)"
          exit 1
        fi
        echo "dotnet SDK $got from $DIR"
